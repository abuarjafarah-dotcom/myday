<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom Mastery Road</title>
<style>
:root {
  --accent: #5D6635; --on-accent: #F7F4E4; --text: #2A1F2B; --muted: #6B5B5F;
  --border: #DDD0BD; --bg: #F5EFE4; --card: #FFFAF2; --soft: #EFE6D6; --ok: #3E7D5A; --ok-soft: #E3F0E7; --warn: #8A5A00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #B9BF72; --on-accent: #1D210F; --text: #F0E6D3; --muted: #B7A79A;
    --border: #3F2C44; --bg: #15101A; --card: #22172A; --soft: #2D1D33; --ok: #7CC096; --ok-soft: #1F3328; --warn: #E0BE7C;
  }
}
:root[data-theme="dark"] {
  --accent: #B9BF72; --on-accent: #1D210F; --text: #F0E6D3; --muted: #B7A79A;
  --border: #3F2C44; --bg: #15101A; --card: #22172A; --soft: #2D1D33; --ok: #7CC096; --ok-soft: #1F3328; --warn: #E0BE7C;
}
* { box-sizing: border-box; }
html { font: -apple-system-body; }
body { margin: 0; padding: 0 0 24px; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; font-size: 0.9375rem; line-height: 1.35; }
h1 { font-size: 1.25rem; margin: 0; font-weight: 600; letter-spacing: -0.3px; }
h2 { font-size: 1rem; margin: 0; font-weight: 600; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.cap { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-size: 0.8125rem; }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
.stat b { display: block; font-size: 1.375rem; font-weight: 600; }
svg text { font-family: -apple-system, system-ui, sans-serif; }
.say { display: flex; gap: 8px; margin: 12px 0 4px; }
.say input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 1rem; }
.btn { min-height: 48px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.sq { width: 48px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.btn.live { background: var(--warn); border-color: var(--warn); color: var(--card); }
.area { padding: 12px 0 0; margin-top: 12px; border-top: 1px solid var(--border); }
.area-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.area-h b { font-weight: 600; }
.badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.badge.on { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.sug { flex: 1; min-width: 0; min-height: 48px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); text-align: left; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.sug svg { flex: none; color: var(--accent); }
.link { background: none; border: 0; padding: 10px 0 0; min-height: 44px; color: var(--muted); font-size: 0.8125rem; text-decoration: underline; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pick .btn { min-height: 44px; padding: 0 10px; font-size: 0.8125rem; }
.ring { flex: none; }
.check { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 8px 0; border-top: 1px solid var(--border); }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.locked { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); margin-top: 8px; }
.bank { background: var(--text); color: var(--bg); border-color: var(--text); }
.bank .cap, .bank .muted { color: var(--bg); }
.bar { height: 8px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 30%, var(--text)); margin: 10px 0; overflow: hidden; }
.bar i { display: block; height: 8px; border-radius: 8px; background: var(--bg); }
.bank .btn { flex: 1; background: none; border: 1px dashed var(--bg); color: var(--bg); }
details summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; }
details summary::-webkit-details-marker { display: none; }
.vault-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
.ybar { display: grid; grid-template-columns: 96px 1fr 28px; align-items: center; gap: 8px; font-size: 0.8125rem; padding: 3px 0; }
.ybar i { height: 10px; border-radius: 6px; background: var(--soft); overflow: hidden; display: block; }
.ybar i b { display: block; height: 10px; border-radius: 6px; background: var(--accent); min-width: 2px; }
.ybar em { font-style: normal; text-align: right; color: var(--muted); }
.grp { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin: 10px 0 0; }
body.print-year .card:not(#yearCard), body.print-year #note, body.print-year #toast, body.print-year .noprint { display: none !important; }
#toast { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--text); color: var(--bg); z-index: 9; }
#toast button { background: none; border: 0; color: var(--bg); font-weight: 600; text-decoration: underline; min-height: 44px; }
#note { font-size: 0.8125rem; color: var(--muted); min-height: 18px; margin: 0 2px 8px; }
</style>
</head>
<body>
<div id="note" role="status"></div>
<div id="app"></div>
<div id="toast" role="status"><span id="toastMsg"></span><button type="button" data-act="undo">Undo</button></div>
<script>
(function () {
  'use strict';
  function matchTheme() {   // follow the dashboard: its per-phone theme and its night layout
    try {
      var pd = parent.document.documentElement, t = pd.dataset.night === '1' && pd.dataset.theme !== 'light' ? 'dark' : pd.dataset.theme;
      if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    } catch (e) {}
  }
  matchTheme();

  var YEAR = 2027, LS = 'mmr-' + YEAR, DOC = 'y' + YEAR, GOAL_H = 180;
  var AREAS = [
    { id: 'soul', name: 'Soul / Islam', sug: [["Qur'an with Hamad, 10 min", 'family'], 'Recitation on the school run', '5 quiet minutes of dua'],
      kw: ['quran', "qur'an", 'pray', 'prayer', 'prayed', 'salah', 'salat', 'dua', 'duaa', 'dhikr', 'fajr', 'mosque', 'masjid', 'ramadan', 'fasted', 'fasting', 'recitation', 'sadaqah', 'charity'] },
    { id: 'social', name: 'Social', sug: ['Voice note to a friend', 'Call family in Amman', 'Coffee with a Montessori mom'],
      kw: ['friend', 'friends', 'called', 'call', 'coffee', 'mama', 'sister', 'brother', 'cousin', 'voice note', 'texted', 'playdate', 'neighbor', 'visited', 'lunch with'] },
    { id: 'active', name: 'Active / Hobby', sug: ['10-min home workout', 'Thursday class', '15 minutes on the garden plan'],
      kw: ['workout', 'gym', 'pilates', 'walk', 'walked', 'run', 'ran', 'treadmill', 'rower', 'rowed', 'yoga', 'garden', 'gardening', 'stretch', 'stretched', 'swim', 'swam', 'exercise'] },
    { id: 'family', name: 'Family', sug: ['One-on-one with Hamad, 15 min', 'Climb-and-jump play with Talal', 'Tea with Omar, phones away', 'Arabic bedtime story'],
      kw: ['hamad', 'talal', 'yousef', 'omar', 'kids', 'boys', 'bedtime', 'story', 'date night', 'one-on-one', 'played with'] },
    { id: 'work', name: 'Work', sug: ['Logged one win', 'Shared a design', 'Laptop closed by pickup'],
      kw: ['work', 'workwave', 'design', 'designed', 'shipped', 'meeting', 'win', 'presented', 'laptop'] },
    { id: 'learn', name: 'Learn', sug: ['AI course, 15 min', 'Tried one AI tool on real work', 'Read one strategy article'],
      kw: ['course', 'learn', 'learned', 'read', 'article', 'book', 'tutorial', 'podcast', 'studied', 'lesson'] },
    { id: 'fun', name: 'Fun / Travel', sug: ['Cooked a family cookbook recipe', 'Planned one piece of the next trip', 'Family outing'],
      kw: ['fun', 'trip', 'travel', 'movie', 'cooked', 'baked', 'recipe', 'outing', 'restaurant', 'shopping', 'show', 'park', 'booked'] }
  ];
  var QUESTS = [
    { id: 'q1', name: 'Family dashboard', line: 'One dashboard, one link, used every morning. Finish before Feb 22.',
      cp: ['Pick the live version as the only one', 'Retire the old versions', 'Version 1 in place: calendar, tasks, grocery, Omar\'s view', 'Opened 5 of 7 mornings, 4 weeks in a row'] },
    { id: 'q2', name: "Kids' learning platform", line: 'Every game as a level under Mobile Magic. All four in before Sep 21.',
      cp: ['Code on GitHub and live on Vercel', 'Saved progress for each child', 'Arabic letters level', 'Math Adventure level', "Teta's Kitchen level", 'Islamic Explorer level', 'Hamad and Talal each play weekly'] },
    { id: 'q3', name: 'Money systems', line: 'Small monthly routines, then the expense and recipe pipeline in Q4.',
      cp: ['Tax tracker logged every month', 'Monthly SPUS and HLAL review reminder set', 'Monthly spending check in place', 'Expense and recipe pipeline feeds the grocery lists'] }
  ];
  var PARKED = ['Portfolio redesign and weekly posts', 'Strategy and AI courses beyond what work needs', 'Mastery World as a separate build', 'Grade 1 curriculum platform and daily storybook', 'Bowling game refinements', 'New family apps: the dashboard covers this'];
  var BOYS = ['Hamad', 'Talal', 'Yousef'];
  var RITUAL = ["Log this month's tax deductions", 'Review SPUS and HLAL, place any trades by hand', 'Spending check against the savings target', "Write this month's wins note", 'Download a backup (button in Year so far)'];
  var TRIPS = [
    { id: 'kw', name: 'Kuwait and Egypt', from: '2027-02-22', to: '2027-03-08' },
    { id: 'ky', name: 'Kyoto', from: '2027-05-09', to: '2027-05-20' },
    { id: 'am', name: "Amman, Kareem's wedding", from: '2027-09-21', to: '2027-10-01' }
  ];
  var PACK = [
    ['Family', ['Passports and travel documents', 'Chargers and plug adapters', 'Medicine kit', 'Car seats or booking for them']],
    ['Hamad', ['Outfits, light layers', 'Pajamas', 'Comfort toy', 'Headphones and tablet', 'Snacks for the flight']],
    ['Talal', ['Outfits, light layers', 'Pajamas', 'Comfort toy', 'Headphones and tablet', 'His safe foods and snacks']],
    ['Yousef', ['Outfits and warm layers', 'Diapers and wipes', 'Bottles and food', 'Sleep sack', 'Stroller']]
  ];
  // Estimated from astronomical calculations; the official day depends on moon sighting.
  var HOLY = [
    { id: 'ram', name: 'Ramadan', from: '2027-02-08', to: '2027-03-08', note: 'Fasting month. Iftar and suhoor times shift daily.' },
    { id: 'eidf', name: 'Eid al-Fitr', from: '2027-03-09', to: '2027-03-11', note: 'Three days of celebration.' },
    { id: 'eida', name: 'Eid al-Adha', from: '2027-05-15', to: '2027-05-17', note: 'Day of Arafah, then Eid.' }
  ];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var STOPS = [
    { f: 0, t: 'Q1', q: 1 }, { d: '02-22', t: 'Kuwait, Egypt' }, { d: '04-01', t: 'Q2', q: 1 }, { d: '05-09', t: 'Kyoto' },
    { d: '07-01', t: 'Q3', q: 1 }, { d: '09-21', t: 'Amman' }, { d: '10-01', t: 'Q4', q: 1 }
  ];

  var anchorY = 0;
  var st = blank(), sugIdx = {}, adding = null, pending = null, lastUndo = null, saveT = null, cloud = 'off', openBox = {}, taskMonths = null;
  function blank() { return { v: 1, logs: [], blocks: [], checks: {}, vault: [], packs: [], custom: {}, opens: {}, gone: [], at: 0 }; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function weekOf(s) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function $(id) { return document.getElementById(id); }

  // ---------- storage: this device first, then the dashboard database ----------
  function clean(o) {
    var b = blank(); if (!o || typeof o !== 'object') return b;
    ['logs', 'blocks', 'vault', 'packs', 'gone'].forEach(function (k) { if (Array.isArray(o[k])) b[k] = o[k]; });
    if (o.opens && typeof o.opens === 'object') b.opens = o.opens;
    if (o.checks && typeof o.checks === 'object') b.checks = o.checks;
    if (o.custom && typeof o.custom === 'object') b.custom = o.custom;
    b.at = +o.at || 0; return b;
  }
  function merge(a, b) {
    var out = blank(), gone = {};
    a.gone.concat(b.gone).forEach(function (id) { gone[id] = 1; });
    out.gone = Object.keys(gone).slice(-500);
    [a.opens, b.opens].forEach(function (o) { Object.keys(o).forEach(function (d) { out.opens[d] = 1; }); });
    ['logs', 'blocks', 'vault', 'packs'].forEach(function (k) {
      var seen = {};
      a[k].concat(b[k]).forEach(function (x) { if (x && x.id && !seen[x.id] && !gone[x.id]) { seen[x.id] = 1; out[k].push(x); } });
    });
    [a.checks, b.checks].forEach(function (c) { Object.keys(c).forEach(function (k) { if (!out.checks[k] || (c[k].at || 0) > (out.checks[k].at || 0)) out.checks[k] = c[k]; }); });
    [a.custom, b.custom].forEach(function (c) { Object.keys(c).forEach(function (k) { if (!out.custom[k] || (c[k].at || 0) > (out.custom[k].at || 0)) out.custom[k] = c[k]; }); });
    out.at = Math.max(a.at, b.at); return out;
  }
  function loadLocal() { try { st = clean(JSON.parse(localStorage.getItem(LS) || 'null')); } catch (e) { st = blank(); } }
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} }
  function note(t) { $('note').textContent = t || ''; }
  function loadCloud() {
    return fetch('/api/store?kind=road', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
      if (r.status === 401) { cloud = 'off'; note('Signed out: saving on this device. Sign in on the dashboard to sync.'); return; }
      if (!r.ok) { cloud = 'off'; note('Offline: saving on this device.'); return; }
      return r.json().then(function (j) {
        var remote = j && j.docs && j.docs.road && j.docs.road[DOC];
        cloud = 'on'; note('');
        if (remote) { var before = JSON.stringify(st); st = merge(st, clean(remote)); saveLocal(); if (JSON.stringify(st) !== before) render(); }
        if (remote && JSON.stringify(st.opens) !== JSON.stringify(clean(remote).opens)) st.at = Date.now();
        if (!remote || st.at > (+remote.at || 0)) pushCloud();
      });
    }).catch(function () { cloud = 'off'; note('Offline: saving on this device.'); });
  }
  function pushCloud() {
    if (cloud !== 'on') return;
    fetch('/api/store', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ writes: [{ kind: 'road', id: DOC, data: st }] }) })
      .then(function (r) { if (!r.ok) note('Could not sync just now. Saved on this device.'); else note(''); })
      .catch(function () { note('Offline: saved on this device.'); });
  }
  function save() { st.at = Date.now(); saveLocal(); clearTimeout(saveT); saveT = setTimeout(pushCloud, 600); }

  // ---------- numbers ----------
  function weeks() {
    var w = {};
    st.logs.forEach(function (l) { var k = weekOf(l.d); (w[k] = w[k] || {})[l.a] = 1; });
    return w;
  }
  function stats() {
    var w = weeks(), bal = 0, calm = 0;
    Object.keys(w).forEach(function (k) { var n = Object.keys(w[k]).length; if (n >= 7) bal++; if (n >= 4) calm++; });
    var cur = w[weekOf(today())] || {};
    return { bal: bal, calm: calm, now: Object.keys(cur).length, cur: cur };
  }
  function countThisWeek(a) { var wk = weekOf(today()); return st.logs.filter(function (l) { return l.a === a && weekOf(l.d) === wk; }).length; }
  function dueBoy() {   // whoever has gone longest without logged one-on-one time
    var last = {};
    st.logs.forEach(function (l) { if (l.a === 'family') BOYS.forEach(function (b) { if (l.t.indexOf(b) >= 0 && (!last[b] || l.d > last[b])) last[b] = l.d; }); });
    var order = BOYS.slice().sort(function (x, y) { var a = last[x] || '', b = last[y] || ''; return a < b ? -1 : a > b ? 1 : 0; });
    return { boy: order[0], last: last[order[0]] || '' };
  }
  function sugList(a) {
    var c = st.custom[a.id], base = a.sug;
    if (a.id === 'family') base = ['One-on-one with ' + dueBoy().boy + ', 15 min'].concat(a.sug.filter(function (s) { return sugText(s).indexOf('One-on-one') < 0; }));
    return ((c && c.list) || []).concat(base);
  }
  function niceDate(s) { var d = new Date(s + 'T12:00:00'); return MONTHS[d.getMonth()] + ' ' + d.getDate(); }
  function daysTo(s) { return Math.ceil((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5); }
  function chk(key, label) { return '<label class="check"><input type="checkbox" data-chk="' + esc(key) + '"' + (st.checks[key] && st.checks[key].on ? ' checked' : '') + '><span>' + esc(label) + '</span></label>'; }
  function isChk(key) { return !!(st.checks[key] && st.checks[key].on); }
  // mornings the dashboard was opened (the dashboard notes them on this device; they are merged here)
  function pullOpens() {
    try { var o = JSON.parse(localStorage.getItem('myday-opens') || '{}'), n = 0; Object.keys(o).forEach(function (d) { if (/^\d{4}-\d\d-\d\d$/.test(d) && !st.opens[d]) { st.opens[d] = 1; n++; } }); return n; } catch (e) { return 0; }
  }
  function openStats() {
    var w = {}; Object.keys(st.opens).forEach(function (d) { var k = weekOf(d); w[k] = (w[k] || 0) + 1; });
    var cur = weekOf(today()), streak = 0, d = new Date(cur + 'T12:00:00');
    if ((w[cur] || 0) >= 5) streak = 1;
    for (var i = 0; i < 60; i++) { d.setDate(d.getDate() - 7); if ((w[ymd(d)] || 0) >= 5) streak++; else break; }
    return { week: w[cur] || 0, streak: streak };
  }
  function firstSunday(y, m) { var d = new Date(y, m, 1); d.setDate(1 + ((7 - d.getDay()) % 7)); return d; }
  function ritualState() {
    var n = new Date(), ym = n.getFullYear() + '-' + pad(n.getMonth() + 1), done = 0, stamps = {};
    RITUAL.forEach(function (_, i) { if (isChk('rit.' + ym + '.' + i)) done++; });
    Object.keys(st.checks).forEach(function (k) { var m = /^rit\.(\d{4}-\d\d)\.(\d)$/.exec(k); if (m && st.checks[k].on) stamps[m[1]] = (stamps[m[1]] || 0) + 1; });
    var count = Object.keys(stamps).filter(function (k) { return stamps[k] >= RITUAL.length; }).length;
    return { ym: ym, done: done, due: n >= firstSunday(n.getFullYear(), n.getMonth()), stamps: count, month: MONTHS[n.getMonth()] };
  }
  function packList(t) {
    var groups = PACK.map(function (g) { return [g[0], g[1].map(function (label, i) { return ['pk.' + t.id + '.' + g[0] + '.' + i, label]; })]; });
    var extra = st.packs.filter(function (x) { return x.trip === t.id; }).map(function (x) { return ['pk.' + t.id + '.x.' + x.id, x.t]; });
    if (extra.length) groups.push(['Added by you', extra]);
    return groups;
  }
  function loadTasks() {   // finished tasks by month, for the year card
    fetch('/api/store?kind=tasks', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.docs || !j.docs.tasks) return;
      var m = {}; Object.keys(j.docs.tasks).forEach(function (id) { var t = j.docs.tasks[id]; if (t && t.status === 'done' && t.completedAt) { var d = new Date(t.completedAt); if (!isNaN(d)) { var k = d.getFullYear() + '-' + pad(d.getMonth() + 1); m[k] = (m[k] || 0) + 1; } } });
      taskMonths = m; render();
    }).catch(function () {});
  }
  function yearHtml() {
    var by = {}, top = {}, max = 1, s = stats();
    st.logs.forEach(function (l) { by[l.a] = (by[l.a] || 0) + 1; top[l.t] = (top[l.t] || 0) + 1; });
    AREAS.forEach(function (a) { max = Math.max(max, by[a.id] || 0); });
    var mins = st.blocks.reduce(function (t, b) { return t + (+b.m || 0); }, 0), cp = 0, cpAll = 0;
    QUESTS.forEach(function (q) { q.cp.forEach(function (_, i) { cpAll++; if (isOn(q.id, i)) cp++; }); });
    var h = '<div class="card" id="yearCard"><details' + (openBox.year ? ' open' : '') + ' data-box="year"><summary><span><h2 style="display:inline">Year so far</h2> <span class="muted">' + st.logs.length + ' logged</span></span><span class="muted">Show</span></summary>' +

  function backup() {
    fetch('/api/store', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
      var blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), docs: j.docs }, null, 1)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'myday-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      toast('Backup downloaded. Keep it somewhere safe.');
    }).catch(function () { toast('Could not make a backup. Sign in on the dashboard and try again.'); });
  }
  function classify(text) {
    var t = ' ' + text.toLowerCase() + ' ', best = 0, hit = [];
    AREAS.forEach(function (a) {
      var n = a.kw.filter(function (k) { return new RegExp('[^a-z]' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[^a-z]').test(t); }).length;
      if (n > best) { best = n; hit = [a.id]; } else if (n && n === best) hit.push(a.id);
    });
    return hit.slice(0, 2);
  }
  function say(text) {
    text = (text || '').trim(); if (!text) return;
    var a = classify(text);
    if (a.length) { pending = null; logTo(a, text); } else { pending = text; render(); }
  }
  function mic() {
    if (!SR) return;
    if (listening && mic.r) { mic.r.stop(); return; }
    var r = mic.r = new SR(); r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = function (e) { var t = e.results[0] && e.results[0][0] && e.results[0][0].transcript; if (t) say(t); };
    r.onerror = function () { toast('Could not hear that. Type it, or use the keyboard microphone.'); };
    r.onend = function () { listening = false; render(); };
    try { r.start(); listening = true; render(); } catch (e) { toast('Voice is not available here. Type it instead.'); }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    if (el.dataset.act !== 'undo') anchorY = el.getBoundingClientRect().bottom + (window.scrollY || 0);
    var a = el.dataset.a, area = AREAS.filter(function (x) { return x.id === a; })[0];
    switch (el.dataset.act) {
      case 'log': { var s = sugList(area)[+el.dataset.i]; logTo([a].concat(Array.isArray(s) ? [s[1]] : []), sugText(s)); break; }
      case 'swap': sugIdx[a] = ((sugIdx[a] || 0) + 1) % sugList(area).length; render(); break;
      case 'own': adding = a; render(); var f = document.querySelector('form[data-form="own"] input'); if (f) f.focus(); break;
      case 'pick': { var t = pending; pending = null; logTo([a], t); break; }
      case 'pick-cancel': pending = null; render(); break;
      case 'mic': mic(); break;
      case 'block': { var id = uid(); st.blocks.push({ id: id, d: today(), m: +el.dataset.m }); save(); render(); toast('Block logged. ' + el.dataset.m + ' minutes in the bank.', function () { remove([id]); }); break; }
      case 'unpark': st.gone.push(el.dataset.id); st.vault = st.vault.filter(function (v) { return v.id !== el.dataset.id; }); vaultOpen = true; save(); render(); break;
      case 'print': openBox.year = true; render(); document.body.classList.add('print-year'); setTimeout(function () { window.print(); setTimeout(function () { document.body.classList.remove('print-year'); }, 500); }, 50); break;
      case 'backup': backup(); break;
      case 'undo': if (lastUndo) { lastUndo(); lastUndo = null; } $('toast').style.display = 'none'; break;
    }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
    anchorY = f.getBoundingClientRect().bottom + (window.scrollY || 0);
    var t = (f.elements.t.value || '').trim(); if (!t) return;
    if (f.dataset.form === 'say') say(t);
    else if (f.dataset.form === 'own') {
      var a = f.dataset.a, cur = (st.custom[a] && st.custom[a].list) || [];
      st.custom[a] = { list: [t.slice(0, 80)].concat(cur).slice(0, 12), at: Date.now() }; sugIdx[a] = 0; adding = null; save(); render(); toast('Added. It is now the first suggestion.');
    } else if (f.dataset.form === 'pack') { st.packs.push({ id: uid(), trip: f.dataset.trip, t: t.slice(0, 80) }); openBox['trip-' + f.dataset.trip] = true; save(); render(); toast('Added to the packing list.');
    } else if (f.dataset.form === 'park') { st.vault.push({ id: uid(), t: t.slice(0, 140), d: today() }); vaultOpen = true; save(); render(); toast('Parked. Focus protected.'); }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.dataset && e.target.dataset.chk; if (!k) return;
    anchorY = e.target.getBoundingClientRect().bottom + (window.scrollY || 0);
    var was = activeQuest(); st.checks[k] = { on: e.target.checked, at: Date.now() }; save(); render();
    var now = activeQuest(); if (now !== was && e.target.checked) toast(now < 0 ? 'All three quests finished.' : 'Quest finished. Quest ' + (now + 1) + ' is unlocked.');
  });
  document.addEventListener('toggle', function (e) {
    if (!e.target.matches) return;
    if (e.target.matches('details[data-vault]')) { vaultOpen = e.target.open; fit(); }
    else if (e.target.matches('details[data-box]')) { openBox[e.target.dataset.box] = e.target.open; fit(); }
  }, true);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { matchTheme(); loadCloud(); } });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);

  function autoQuest() {   // tick the mornings checkpoint once four weeks reach 5 of 7
    if (openStats().streak >= 4 && !isOn('q1', 3)) { st.checks['q1.3'] = { on: true, at: Date.now() }; return true; }
    return false;
  }
  loadLocal(); var changed = pullOpens() > 0; if (autoQuest()) changed = true; if (changed) save();
  render(); loadCloud().then(function () { if (autoQuest()) { save(); render(); } }); loadTasks(); loadPhotos();
})();
</script>
