<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capture">
<meta name="theme-color" content="#FAF7F2">
<title>Capture</title>
<style>
:root { --accent: #4E7358; --on-accent: #fff; --text: #2B2A26; --muted: #6B665D; --border: #E6DED2; --bg: #FAF7F2; --card: #fff; --ok: #4E7358; --warn: #8A5A2B; --warn-bg: #FBF1E4;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root { --accent: #8FB59A; --on-accent: #1A1916; --text: #EDE8DF; --muted: #A9A296; --border: #3A3731; --bg: #1A1916; --card: #22211D; --ok: #8FB59A; --warn: #E2C9A6; --warn-bg: #2E2820; } }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
h1 { font-size: 20px; }
p.hint { font-size: 14px; color: var(--muted); }
textarea { flex: 1; min-height: 180px; width: 100%; padding: 14px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 12px; resize: none; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { min-height: 52px; border: none; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: 600 17px/1 inherit; font-family: inherit; cursor: pointer; }
button:disabled { opacity: .5; }
.status { min-height: 24px; font-size: 15px; text-align: center; }
.status.ok { color: var(--ok); font-weight: 600; }
.status.err { color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px; }
a { color: var(--accent); font-size: 14px; text-align: center; min-height: 44px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<main>
  <h1>🧠 Brain dump</h1>
  <p class="hint" id="hint">Type or tap the keyboard's 🎤 to talk. It goes to "Brain dumps to sort" on your dashboard.</p>
  <textarea id="text" placeholder="Everything on your mind…" aria-label="Brain dump"></textarea>
  <button id="send">Save to dashboard</button>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <a href="/dashboard">Open dashboard</a>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'capture-key';
  // The key rides in the link's #k=… part, which browsers never send to the server. It stays in the link so a
  // Home Screen icon made from this page keeps working (Home Screen apps don't share Safari's storage).
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('k')) { try { localStorage.setItem(KEY, hash.get('k')); } catch (e) {} }
  let key = hash.get('k') || ''; try { key = key || localStorage.getItem(KEY) || ''; } catch (e) {}
  const status = (msg, cls) => { $('status').textContent = msg; $('status').className = 'status ' + (cls || ''); };
  if (!key) { status('Open this page once from the setup link so it knows your capture key.', 'err'); $('send').disabled = true; }

  async function send() {
    const text = $('text').value.trim();
    if (!text) { status('Nothing to save yet.', 'err'); return; }
    $('send').disabled = true; status('Saving…');
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const r = await fetch('/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key }, body: JSON.stringify({ text }) });
        const body = await r.json().catch(() => ({}));
        if (r.ok) {
          status('✓ Saved to your dashboard', 'ok'); $('text').value = '';
          if (new URLSearchParams(location.search).get('text')) history.replaceState(null, '', location.pathname + location.hash);
          $('send').disabled = false; return;
        }
        status(r.status === 401 ? 'The capture key on this phone is wrong. Open the setup link again.' : (body.error || 'Couldn\u2019t save. Try again.'), 'err');
        $('send').disabled = false; return;
      } catch (e) {
        if (attempt === 3) { status('No connection. Your text is still here. Tap Save to try again.', 'err'); $('send').disabled = false; return; }
        await new Promise(res => setTimeout(res, 800 * attempt));
      }
    }
  }
  $('send').addEventListener('click', send);

  // From the Shortcut: ?text=… fills the box and saves right away.
  const incoming = new URLSearchParams(location.search).get('text');
  if (incoming && key) { $('text').value = incoming; send(); }
})();
</script>
</body>
</html>
