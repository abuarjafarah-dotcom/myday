<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farah Master Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* Calm palette from the Teta's Kitchen work: sage accent, warm paper neutrals, terracotta only for "now". */
  --accent: #4E7358; --on-accent: #ffffff; --now: #B5543A; --cal: #8C8579;
  --kids: #C4714A; --work: #B8893A; --home: #6E86A0; --errands: #8C6E9E; --self: #B47A86; --activity: #5E9690; --omar: #A68166;
  --primary: #2B2A26; --text: #2B2A26; --body: #3A3833; --muted: #6B665D; --faint: #756F65;
  --border: #E6DED2; --bg: #FAF7F2; --card: #ffffff; --soft: #F3EDE4; --chip: #E8EFE9;
  --carry: #FBF1E4; --carry-line: #E2C9A6; --carry-ink: #8A5A2B;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #8FB59A; --on-accent: #1A1916; --now: #E08A6A; --cal: #8F887C;
    --primary: #EDE8DF; --text: #EDE8DF; --body: #DDD7CC; --muted: #A9A296; --faint: #9A9387;
    --border: #3A3731; --bg: #1A1916; --card: #22211D; --soft: #2A2824; --chip: #26302A;
    --carry: #2E2820; --carry-line: #6B5536; --carry-ink: #E2C9A6;
  }
}
:root[data-theme="dark"] {
  --accent: #8FB59A; --on-accent: #1A1916; --now: #E08A6A; --cal: #8F887C;
  --primary: #EDE8DF; --text: #EDE8DF; --body: #DDD7CC; --muted: #A9A296; --faint: #9A9387;
  --border: #3A3731; --bg: #1A1916; --card: #22211D; --soft: #2A2824; --chip: #26302A;
  --carry: #2E2820; --carry-line: #6B5536; --carry-ink: #E2C9A6;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  padding: 16px 16px 96px; max-width: 760px; margin: 0 auto; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 16px; color: var(--body); background: var(--card); }
input[type="checkbox"] { width: 22px; height: 22px; margin: 11px 4px; accent-color: var(--accent); flex: 0 0 auto; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }

/* HEADER: one slim row (date · weather · dress-code chip) */
.header { margin-bottom: 8px; }
.hdr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 44px; }
.hdr-when { flex: 1 1 auto; min-width: 0; font-size: 15px; color: var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-when strong { color: var(--primary); font-weight: 700; }
.hdr-when .sep { color: var(--faint); margin: 0 4px; }
.dress-chip { flex: 0 1 auto; max-width: 52%; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;
  background: var(--soft); color: var(--body); border: 1px solid var(--border); border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
.dress-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dress-chip[aria-expanded="true"] { border-color: var(--accent); }
.dress-panel { flex-basis: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--body); }
.dc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dc-box { padding: 10px; background: var(--soft); border-radius: 8px; }
.dc-box .who { font-size: 13px; font-weight: 700; color: var(--primary); }
.dc-box .what { font-size: 14px; margin-top: 4px; }
.dc-box input { width: 100%; margin-top: 6px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); min-height: 44px; }
.dc-acts { display: flex; justify-content: flex-end; margin-top: 10px; }
.sync { font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
.sync.warn { color: var(--carry-ink); border-color: var(--carry-line); background: var(--carry); flex-basis: 100%; text-align: center; border-radius: 8px; }
.hdr .sync:not(.warn) { flex: 0 0 auto; width: 10px; height: 10px; padding: 0; overflow: hidden; color: transparent; background: var(--accent); border: none; }
.page-foot { display: flex; justify-content: center; margin-top: 24px; }
.page-foot a { font-size: 13px; color: var(--muted); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.tab-btn { padding: 12px 12px 10px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--accent); }
.tab-btn .count { display: inline-block; min-width: 16px; font-size: 13px; background: var(--chip); color: var(--accent); border-radius: 999px; padding: 0 5px; margin-left: 4px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.sub-tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.sub-tab-btn.active { color: var(--primary); border-bottom-color: var(--accent); }

/* CARD */
.card { background: var(--card); border-radius: 8px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
.card h2 { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
.card.carry { background: var(--carry); border-color: var(--carry-line); }

/* BRAIN DUMP */
.dump textarea { width: 100%; min-height: 96px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; resize: vertical; line-height: 1.5; }
.dump .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.dump .row .muted { flex: 1; font-size: 13px; }

/* TASK ROWS */
.task-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--accent); font-size: 14px; min-height: 44px; }
.task-item .text { flex: 1; color: var(--body); min-width: 0; overflow-wrap: anywhere; }
.task-item .meta { display: block; font-size: 13px; color: var(--faint); margin-top: 1px; }
.task-item.done { opacity: .5; }
.task-item.done .t { text-decoration: line-through; }
.carry .task-item { background: var(--card); }
.badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 0 6px; white-space: nowrap; line-height: 1.5; border-radius: 4px; background: var(--carry); color: var(--carry-ink); border: 1px solid var(--carry-line); margin-right: 4px; }
.badge.proj { background: var(--chip); color: var(--accent); border-color: transparent; }
.mini { flex: 0 0 auto; padding: 6px 8px; font-size: 13px; font-weight: 600; background: var(--card); color: var(--primary); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; min-height: 44px; min-width: 44px; }
.mini.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mini.ghost { border-color: transparent; background: none; color: var(--faint); }
.toggle-line { font-size: 13px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 6px 0; font-weight: 600; }
.empty { font-size: 13px; color: var(--faint); padding: 6px 2px; }

/* KEY TIMES / SUGGESTIONS */
.key-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--body); padding: 4px 0; border-bottom: 1px dashed var(--border); }
.key-row:last-of-type { border-bottom: none; }
.suggestions { background: var(--soft); padding: 12px; border-radius: 8px; border-left: 3px solid var(--accent); font-size: 14px; color: var(--body); line-height: 1.6; margin-bottom: 12px; }
.suggestions strong { display: block; margin-bottom: 4px; }
.suggestions div + div { margin-top: 6px; }

/* INPUT ROWS */
.add-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.add-row input[type="text"], .add-row select, .add-row input[type="time"] { flex: 1 1 140px; min-width: 0; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
.btn-add { padding: 10px 14px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn-add.full { width: 100%; margin-top: 12px; }
.btn-add:disabled { opacity: .6; cursor: default; }
.btn-secondary { padding: 10px 14px; background: var(--bg); color: var(--primary); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px; }

/* REVIEW */
.review { border-color: var(--accent); }
.rv-sec { font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 6px; }
.rv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; border-radius: 6px; background: var(--bg); margin-bottom: 6px; border-left: 3px solid var(--accent); }
.rv-row.off { opacity: .45; }
.rv-row input[type="text"] { flex: 1 1 160px; min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; }
.rv-row select { padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }
.rv-note { flex-basis: 100%; font-size: 13px; color: var(--faint); padding-left: 26px; }
.rv-actions { display: flex; gap: 8px; margin-top: 10px; }
.rv-actions .btn-add { flex: 1; }

/* DONUT + STATUS */
.donut-container { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; }
.donut-svg { flex: 0 0 120px; width: 120px; height: 120px; }
.donut-legend { flex: 1; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 6px; color: var(--body); }
.legend-color { width: 12px; height: 12px; border-radius: 2px; }
.legend-count { font-weight: 700; color: var(--primary); }
.status-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.status-box { text-align: center; padding: 12px; background: var(--card); border-radius: 6px; border: 1px solid var(--border); }
.status-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.status-count { font-size: 28px; font-weight: 700; color: var(--primary); margin: 6px 0 0; }

/* KANBAN */
.kanban { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 680px) { .kanban { grid-template-columns: repeat(3, 1fr); } }
.kcol { background: var(--soft); border-radius: 8px; padding: 10px; }
.kcol h3 { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 8px; display: flex; justify-content: space-between; }
.kcard { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; color: var(--body); }
.kcard .meta { font-size: 13px; color: var(--faint); margin-top: 2px; }
.kcard .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.kcard.done { opacity: .55; }
.kcard.done .t { text-decoration: line-through; }

/* Touch targets: 44px minimum */
.tab-btn, .sub-tab-btn { min-height: 44px; }
.toggle-line, .h2-link { min-height: 44px; display: inline-flex; align-items: center; }
.task-item .mini.ghost, .key-row .mini.ghost { min-width: 44px; }
.task-item { min-height: 52px; }

/* FOLDS: collapsible Home sections (Inbox, Key times, Suggestions) */
details.fold { padding: 0; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 52px; padding: 0 14px; font-size: 14px; font-weight: 700; color: var(--primary); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg); margin: -4px 4px 0 0; flex: 0 0 auto; }
details.fold[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
details.fold > summary .count { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); }
details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
.fold-body { padding: 0 14px 14px; }
.fold-body > div > .card { border: 0; padding: 0; margin: 0 0 8px; background: none; }
.fold-body > div > .card > h2 { display: none; }

/* CAPACITY: Full / Light / Survival */
.cap { display: inline-flex; background: var(--soft); border: 1px solid var(--border); border-radius: 999px; padding: 2px; gap: 2px; }
.cap button { min-height: 44px; min-width: 44px; padding: 0 12px; border: none; background: none; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.cap button[aria-pressed="true"] { background: var(--card); color: var(--primary); box-shadow: 0 0 0 1px var(--border); }
body[data-cap="survival"] .cap button[aria-pressed="true"] { background: var(--carry); color: var(--carry-ink); }
.cap-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.paused { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 8px; }
.paused .task-item { opacity: .6; }
body[data-cap="survival"] .tab-btn[data-tab="projects"] { display: none; }

/* DRESS: auto from weather */
.dc-why { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.dc-acts { gap: 8px; }

/* INBOX: one-tap "Make task" */
.mail-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 6px; }
.mail-row .mail-item { flex: 1; min-width: 0; margin-bottom: 0; }
.mail-row .mini { align-self: center; white-space: nowrap; }
.mail-row .mini.made { color: var(--accent); border-color: var(--chip); background: var(--chip); }

/* WEEKLY RESET */
.reset-banner { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--chip); border-color: transparent; }
.reset-banner span { font-size: 14px; color: var(--body); }
.rs-stat { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.rs-stat div { flex: 1 1 90px; background: var(--soft); border-radius: 8px; padding: 10px; }
.rs-stat b { display: block; font-size: 24px; color: var(--primary); }
.rs-stat span { font-size: 13px; color: var(--muted); }
.rs-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--body); margin: 4px 0; }
.rs-bar .lbl { flex: 0 0 72px; }
.rs-bar .trk { flex: 1; height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.rs-bar .trk i { display: block; height: 100%; border-radius: 4px; }
.rs-stuck { padding: 10px; border: 1px solid var(--border); border-left: 3px solid var(--carry-line); border-radius: 8px; margin-bottom: 8px; background: var(--card); }
.rs-stuck .t { font-size: 14px; color: var(--body); overflow-wrap: anywhere; }
.rs-stuck .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.rs-stuck .acts { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.rs-stuck input[type="date"] { flex: 1 1 120px; min-width: 0; min-height: 44px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; }
.rs-store { border-top: 1px solid var(--border); padding: 8px 0; }
.rs-store:first-child { border-top: none; }
.rs-store .hd { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--primary); }
.rs-store .hd .n { flex: 1; }
.rs-store ul { margin: 4px 0 0 22px; font-size: 14px; color: var(--body); }

/* NOW: next-up card with a full-day expansion (Home, top) */
.now-card { padding: 14px; }
.now-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.now-head h2 { margin: 0; }
.now-clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.now-hero { background: var(--chip); border-radius: 10px; padding: 12px 14px; border-left: 4px solid var(--accent); }
.now-hero .lbl { font-size: 13px; color: var(--muted); }
.now-hero .ttl { font-size: 18px; font-weight: 700; color: var(--primary); margin: 2px 0; line-height: 1.3; overflow-wrap: anywhere; }
.now-hero .sub { font-size: 13px; color: var(--muted); }
.now-hero .big { font-size: 26px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; margin: 2px 0; }
.now-hero .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.now-hero .acts .btn-add, .now-hero .acts .btn-secondary { min-height: 44px; }
.now-then { margin-top: 12px; }
.now-then .h { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.now-row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--body); }
.now-row:last-child { border-bottom: none; }
.now-row .when { flex: 0 0 72px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.now-row .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.now-row .rel { flex: 0 0 auto; font-size: 13px; color: var(--accent); font-weight: 600; }
.now-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; }
.now-dot.cal { border-radius: 2px; background: transparent !important; border: 2px solid var(--cal); width: 10px; height: 10px; }
.now-dot.key { background: transparent; border: 2px solid var(--faint); width: 9px; height: 9px; }
.now-toggle { display: flex; width: 100%; text-align: left; margin-top: 8px; min-height: 44px; }
.now-day { margin-top: 4px; }
.now-day .now-row.past { opacity: .5; }
.now-day .now-row.done .what { text-decoration: line-through; }
.now-allday { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.now-allday span { font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--body); }
.now-line { display: flex; align-items: center; gap: 8px; color: var(--now); font-size: 13px; font-weight: 600; margin: 4px 0; }
.now-line i { flex: 1; height: 2px; background: var(--now); border-radius: 1px; }
.now-gap { border: 1px dashed var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.now-gap .gh { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.now-gap .fit { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--body); margin-top: 6px; }
.now-gap.current { border-color: var(--accent); }

/* BOARD: shared by Home "Today" and the Kanban, with pointer drag-and-drop */
.kcol h3 { font-size: 13px; }
.kcard { display: flex; gap: 6px; align-items: flex-start; padding-left: 4px; }
.kcard .kbody { flex: 1; min-width: 0; padding-top: 2px; }
.drag-handle { flex: 0 0 auto; width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
  background: none; border: none; border-radius: 6px; color: var(--faint); font-size: 16px; line-height: 1; letter-spacing: -2px;
  cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
.drag-handle:hover { background: var(--soft); color: var(--muted); }
.task-item .drag-handle { margin-left: -8px; }
.drop { min-height: 48px; border-radius: 8px; transition: background-color .12s; }
.drop.over { background: var(--chip); }
.grp-h { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
.grp-h:first-child { margin-top: 0; }
.drop .empty { padding: 12px 8px; border: 1px dashed var(--border); border-radius: 6px; text-align: center; }
.drag-src { visibility: hidden; height: 0 !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; border: 0 !important; overflow: hidden; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0 !important; transform: rotate(1.5deg) scale(1.02);
  box-shadow: 0 12px 28px rgba(20, 24, 40, .22); opacity: .97; }
.drag-placeholder { border: 2px dashed var(--accent); border-radius: 6px; background: var(--chip); margin-bottom: 8px; }
body.dragging, body.dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
.carry-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--body); }
@media (prefers-reduced-motion: reduce) { .drag-ghost { transform: none; } .drop { transition: none; } }

/* WEEK */
.week-day { padding: 12px; margin-bottom: 10px; background: var(--card); border-radius: 6px; border: 1px solid var(--border); border-left: 3px solid var(--accent); }
.week-day.is-today { border-left-color: var(--accent); }

.accordion-header.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.accordion-header.active .right { color: var(--on-accent); }
.progress { width: 44px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--activity); }
.accordion-content { padding: 10px; background: var(--bg); border-radius: 6px; margin: -4px 0 10px; border: 1px solid var(--border); }
.accordion-content .task-item { background: var(--card); }
.note-item { font-size: 13px; color: var(--body); padding: 8px 10px; background: var(--card); border-radius: 6px; border-left: 3px dashed var(--self); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }

.cal-item { display: flex; gap: 10px; align-items: baseline; padding: 10px; margin-bottom: 6px; background: var(--card); border-radius: 6px; border: 1px solid var(--border); border-left: 3px solid var(--cal); min-height: 44px; font-size: 14px; color: var(--body); }

    $('weatherLine').textContent = w ? String(w.condition || '').toLowerCase() : '';
    const mc = $('mailCount'); if (mc) mc.textContent = live.authed && live.mail && live.mail.length ? `${live.mail.length} unread` : '';

    $('gmailList').innerHTML = mh;

    else if (live.cal && evs.length) ch = evs.map(ev => `<div class="cal-item" title="${esc(ev.calendar || '')}"><span class="when">${esc(evTime(ev))}</span><span class="what">${esc(ev.title || '(No title)')}</span><span class="src">${srcIcon(ev)} ${esc(ev.calendar || (ev.source === 'icloud' ? 'iCloud' : 'Google'))}</span></div>`).join('');
    else if (live.cal) ch = '<div class="empty">Nothing on your calendar today.</div>';
    $('calTodayBox').innerHTML = ch ? `<div class="card"><h2><span>📅 Calendar today</span><a class="h2-link" href="https://calendar.google.com" target="_blank" rel="noopener">Open ↗</a></h2>${ch}</div>` : '';
  }

  async function init() {
    wireEvents();
    wireSmart();
    wireNow();
    wireFolds();
    wireExtras();
    render();
    loadLive();
    setInterval(loadLive, 10 * 60000);
    setInterval(checkDay, 60000);
    document.addEventListener('visibilitychange', checkDay);
    $('dumpText').value = lsGet(LS.draft, '') || '';

    goLocal();
    await loadCloud();
    setInterval(() => { if (!document.hidden) loadCloud(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCloud(); });
  }

  // ---------- cloud sync through /api/store (Supabase) ----------
  let srvAll = emptyState(), loadingCloud = false, cloudNote = '';
  async function loadCloud() {
    if (loadingCloud || flushing) return;
    loadingCloud = true;
    try {
      const r = await fetch('/api/store', { credentials: 'same-origin', cache: 'no-store' });
      if (r.status === 401) { cloudNote = 'Signed out: saved on this device'; return; }
      if (r.status === 503) { cloudNote = 'Sync not set up: saved on this device'; return; }
      if (!r.ok) { cloudNote = 'Offline: saved on this device'; return; }
      const data = await r.json();
      const next = emptyState();
      KINDS.forEach(k => { next[k] = (data.docs && data.docs[k]) || {}; });
      const serverEmpty = KINDS.every(k => !Object.keys(next[k]).length);
      if (serverEmpty && mode !== 'cloud') {
        // First device to sync uploads what it already has.
        KINDS.forEach(k => Object.values(S[k]).forEach(o => { if (o && o.id) pending[k + '/' + o.id] = o; }));
        savePending();
      }
      srvAll = next; cloudNote = ''; mode = 'cloud';
      applyCloud();
      scheduleFlush(0);
    } catch (e) {
      cloudNote = 'Offline: saved on this device';
    } finally {
      loadingCloud = false; renderSync();
    }
  }
  function applyCloud() {
    const next = emptyState();
    KINDS.forEach(k => { next[k] = Object.assign({}, srvAll[k]); });
    for (const [k, v] of Object.entries(pending)) {
      const i = k.indexOf('/'); const kind = k.slice(0, i); const id = k.slice(i + 1);
      if (!next[kind]) continue;
      if (v === null) delete next[kind][id]; else next[kind][id] = v;
    }
    S = next; saveCache(); render();
  }
  function goLocal() { mode = 'local'; render(); maybeMigrate(true); }

  function checkDay() {
    if (today() !== lastDay) { lastDay = today(); render(); }
  }

  // ---------- one-time import from Dashboard v3 storage on this device ----------
  function maybeMigrate(force) {
    if (migrated) return;
    if (!force && !['tasksOpen', 'tasksClosed', 'projects', 'grocery', 'meta'].every(n => firstSeen.has(n))) return;
    migrated = true;
    try { migrateV3(); } catch (e) { console.warn('migration', e); }
  }
  function migrateV3() {
    if (lsGet(LS.migrated, false)) return;
    let touched = false;

    // Tasks: v3 kept one list per day. Group by title; the latest day decides done/open.
    const keys = Object.keys(localStorage).filter(k => k.startsWith('fmd-tasks-v3-')).sort();
    const groups = new Map();
    keys.forEach(k => {
      const date = k.slice('fmd-tasks-v3-'.length);
      let arr = [];
      try { arr = JSON.parse(localStorage.getItem(k)) || []; } catch (e) {}
      arr.forEach(t => {
        const title = String(t.text || '').trim(); if (!title) return;
        const key = norm(title);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ date, t, title });
      });
    });
    const openTitles = new Set(Object.values(S.tasks).filter(isOpen).map(t => norm(t.title)));
    groups.forEach((entries, key) => {
      entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      // keep every completed instance as history (one per day)
      const seenDoneDays = new Set();
      entries.filter(e => e.t.done).forEach(e => {
        if (seenDoneDays.has(e.date)) return; seenDoneDays.add(e.date);
        const id = `m3-${e.date}-${String(e.t.id).replace(/[^\w-]/g, '')}`;
        if (S.tasks[id]) return;
        const at = parseYmd(e.date); at.setHours(12);
        stage('tasks', { id, title: e.title, category: CATS[e.t.category] ? e.t.category : 'home', projectId: null, date: e.date, time: e.t.time || null,
          duration: null, priority: null, status: 'done', notes: '', createdAt: at.getTime(), completedAt: at.getTime(), source: 'migrated-v3' });
        touched = true;
      });
      const last = entries[entries.length - 1];
      if (last.t.done || openTitles.has(key)) return;
      // open: carried from the first undone day after the last completion
      let lastDoneIdx = -1; entries.forEach((e, i) => { if (e.t.done) lastDoneIdx = i; });
      const first = entries[lastDoneIdx + 1];
      const id = `m3-${first.date}-${String(first.t.id).replace(/[^\w-]/g, '')}`;
      if (S.tasks[id]) return;
      stage('tasks', { id, title: first.title, category: CATS[first.t.category] ? first.t.category : 'home', projectId: null, date: first.date,
        time: first.t.time || null, duration: null, priority: null, status: 'todo', notes: '', createdAt: parseYmd(first.date).getTime(), completedAt: null, source: 'migrated-v3' });
      openTitles.add(key); touched = true;
    });

    // Projects: merge v3 subtasks into same-named projects.
    const oldProjects = lsGet('fmd-projects-v3', null);
    if (Array.isArray(oldProjects)) {
      const SUMMER_OLD = ['plan summer activities', 'book camps outings', 'prepare budget'];
      oldProjects.forEach(op => {
        let name = String(op.name || '').trim(); if (!name) return;
        const isSummer = /summer\s*2026/i.test(name);
        if (isSummer) name = '☀️ Summer 2026 Picture Book';
        const plain = norm(name);
        let p = Object.values(S.projects).find(x => norm(x.name) === plain || (isSummer && /summer 2026/.test(norm(x.name))));
        if (!p) { p = { id: newId('p'), name, category: 'self', status: 'active', notes: '', createdAt: Date.now() }; stage('projects', p); touched = true; }
        (op.tasks || []).forEach(title => {
          if (isSummer && SUMMER_OLD.includes(norm(title))) return;
          const exists = Object.values(S.tasks).some(t => t.projectId === p.id && norm(t.title) === norm(title));
          if (exists) return;
          stage('tasks', { id: newId('t'), title: String(title), category: p.category || 'self', projectId: p.id, date: null, time: null, duration: null,
            priority: null, status: 'todo', notes: '', createdAt: Date.now(), completedAt: null, source: 'migrated-v3' });
          touched = true;
        });
      });
    }

    // Grocery: v3 items were never checkable, so all come in unchecked.
    const oldGrocery = lsGet('fmd-grocery-v3', null);
    if (Array.isArray(oldGrocery)) {
      oldGrocery.forEach(g => {
        const store = String(g.name || '').replace(/^[^\p{L}\p{N}]+/u, '').trim() || 'Other';
        (g.items || []).forEach(item => {
          const dup = Object.values(S.grocery).some(x => !x.archived && x.store === store && norm(x.item) === norm(item));
          if (dup) return;
          stage('grocery', { id: newId('g'), item: String(item), store, checked: false, archived: false, quantity: null, notes: '', createdAt: Date.now() });
          touched = true;
        });
        if (!stores().includes(store)) { setMetaStaged({ stores: [...stores(), store] }); touched = true; }
      });
    }

    lsSet(LS.migrated, true);
    if (touched) commit();
  }

  // ---------- domain helpers ----------
  const meta = () => S.meta.main || {};
  function setMetaStaged(patch) { stage('meta', Object.assign({ id: 'main' }, clone(meta()), patch)); }
  function setMeta(patch) { setMetaStaged(patch); commit(); }
  function stores() {
    const list = Array.isArray(meta().stores) && meta().stores.length ? meta().stores.slice() : DEFAULT_STORES.slice();
    Object.values(S.grocery).forEach(g => { if (!g.archived && g.store && !list.includes(g.store)) list.push(g.store); });
    return list;
  }
  function makeTask(f) {
    return { id: newId('t'), title: f.title, category: CATS[f.category] ? f.category : 'home', projectId: f.projectId || null,
      date: f.date || null, time: f.time || null, duration: null, priority: null, status: 'todo', notes: '',
      createdAt: Date.now(), completedAt: null, source: f.source || 'manual' };
  }
  function setTask(id, patch) {
    const t = S.tasks[id]; if (!t) return;
    const n = Object.assign({}, t, patch);
    if (patch.status === 'done' && t.status !== 'done') n.completedAt = Date.now();
    if (patch.status && patch.status !== 'done') n.completedAt = null;
    put('tasks', n);
  }
  function moveTo(id, date) {
    const t = S.tasks[id]; if (!t) return;
    setTask(id, { date, originalDate: t.originalDate || t.date || null, status: t.status === 'dropped' ? 'todo' : t.status });
  }
  function views() {
    const td = today(); const everything = Object.values(S.tasks);
    const all = everything.filter(capVisible);
    return {
      td,
      paused: everything.filter(t => isOpen(t) && !capVisible(t) && t.date && t.date <= td).sort(byTime),
      carry: all.filter(t => isOpen(t) && t.date && t.date < td).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byTime(a, b)),
      todayOpen: all.filter(t => isOpen(t) && t.date === td).sort(byTime),
      anytime: all.filter(t => isOpen(t) && !t.date && !t.projectId).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)),
      doneToday: all.filter(t => t.status === 'done' && t.completedAt && ymd(new Date(t.completedAt)) === td).sort((a, b) => b.completedAt - a.completedAt)
    };
  }
  const projName = id => { const p = S.projects[id]; return p ? p.name : ''; };

  // ---------- render ----------
  function render() {
    if (drag) { renderDeferred = true; return; }   // never rebuild the DOM under a finger
    const keep = rememberFocus();
    renderHeader(); renderTabs(); renderHint(); renderSync();
    renderReview(); renderWaiting(); renderCarry(); renderToday(); renderAnytime(); renderSuggest(); renderKeyTimes();
    renderSchedule(); renderWeek(); renderProjects(); renderIdeas(); renderGrocery(); renderLive();
    renderTracker(); renderSmart(); renderNow(); renderResetBanner(); renderReset();
    restoreFocus(keep);
  }
  function rememberFocus() {
    const a = document.activeElement;
    if (!a || !a.id || !/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return null;
    return { id: a.id, value: a.value, s: a.selectionStart, e: a.selectionEnd };
  }
  function restoreFocus(k) {
    if (!k) return; const el = $(k.id); if (!el || el === document.activeElement) return;
    el.value = k.value; el.focus();
    try { if (k.s != null) el.setSelectionRange(k.s, k.e); } catch (e) {}
  }

  function renderSync() {
    const el = $('sync'); const n = Object.keys(pending).length;
    el.classList.remove('warn');
    if (writeError) { el.textContent = writeError; el.classList.add('warn'); }
    else if (mode === 'starting') el.textContent = 'Loading…';
    else if (mode === 'local' && cloudNote) { el.textContent = cloudNote; el.classList.add('warn'); }
    else if (mode === 'local') el.textContent = 'Connecting…';
    else if (n || flushing) el.textContent = 'Saving…';
    else el.textContent = '✓ Synced';
  }
  // Dress code. Rules: the big boys get as few layers as the weather allows (sensory comfort);
  // Yousef gets the full bundle. Edit these rows to tune; `max` is the feels-like °F ceiling for that row.
  const DRESS_RULES = [
    { max: 20,  big: 'Winter coat + hat + mittens', baby: 'Thermal onesie + fleece + snowsuit + hat & mittens' },
    { max: 32,  big: 'Sweatshirt + warm jacket + hat', baby: 'Thermal onesie + fleece + puffer + hat & mittens' },
    { max: 45,  big: 'Sweatshirt + light jacket', baby: 'Thermal onesie + fleece + jacket + hat' },
    { max: 55,  big: 'Sweatshirt', baby: 'Long-sleeve onesie + pants + fleece + socks' },
    { max: 65,  big: 'Long sleeves', baby: 'Long-sleeve onesie + pants + socks' },
    { max: 75,  big: 'T-shirt + pants', baby: 'Onesie + light pants' },
    { max: 999, big: 'T-shirt + shorts', baby: 'Short-sleeve onesie + sun hat' }
  ];
  function autoDress(w) {
    if (!w || w.feelsLike == null) return null;
    const feel = Math.min(w.feelsLike, w.lowFeels != null ? w.lowFeels + 6 : w.feelsLike);   // dress for the cold end of the outing
    const row = DRESS_RULES.find(r => feel <= r.max) || DRESS_RULES[DRESS_RULES.length - 1];
    const cond = String(w.condition || '');
    const wet = /rain|drizzle|shower|thunder/i.test(cond) || (w.precipChance || 0) >= 50;
    const snow = /snow/i.test(cond);
    let big = row.big, baby = row.baby;
    if (snow) { big += ' + snow boots'; baby += ' + snow boots'; }
    else if (wet) { big = big.replace(/light jacket|warm jacket/, 'rain jacket'); if (!/rain jacket/.test(big)) big += ' + rain jacket'; baby += ' + stroller rain cover'; }
    const why = `Feels like ${Math.round(feel)}°F${cond ? ', ' + cond.toLowerCase() : ''}${w.precipChance >= 30 ? `, ${w.precipChance}% chance of rain` : ''}`;
    return { big, baby, why };
  }
  function dressToday() {
    const dc = meta().dress || {};
    if (dc.date === today() && (dc.big || dc.baby)) return { big: dc.big || '', baby: dc.baby || '', manual: true };
    const a = autoDress(live.weather);
    return a ? Object.assign(a, { manual: false }) : { big: '', baby: '', manual: false, why: 'Waiting for the weather…' };
  }
  function renderHeader() {
    const d = new Date();
    $('dayName').textContent = d.toLocaleDateString('en-US', { weekday: 'short' }) + ',';
    $('dateStr').textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const dr = dressToday();
    const big = dr.big, baby = dr.baby;
    const open = !!(ui.open.dress || editDress);
    const chipText = big || baby || 'Dress code';
    $('dress').innerHTML = `<button class="dress-chip" data-act="dress-toggle" aria-expanded="${open}" aria-controls="dressPanel" title="Today's dress code">👕 <span>${esc(chipText)}</span></button>
      ${open ? `<div class="dress-panel" id="dressPanel">
        <div class="dc-why">${dr.manual ? 'Your choice for today. It goes back to automatic tomorrow.' : esc(dr.why || '') + ' · set automatically'}</div>
        <div class="dc-grid">
          <div class="dc-box"><div class="who">Hamad & Talal</div>${editDress ? `<input id="dcBig" value="${esc(big)}" placeholder="sweatshirt + light jacket">` : `<div class="what">${esc(big || 'Not set')}</div>`}</div>
          <div class="dc-box"><div class="who">Yousef</div>${editDress ? `<input id="dcBaby" value="${esc(baby)}" placeholder="onesie + fleece + hat">` : `<div class="what">${esc(baby || 'Not set')}</div>`}</div>
        </div>
        <div class="dc-acts">${dr.manual && !editDress ? '<button class="btn-secondary" data-act="dress-auto">Use automatic</button>' : ''}<button class="btn-secondary" data-act="dress-edit">${editDress ? 'Save for today' : 'Edit'}</button></div>
      </div>` : ''}`;
  }

  function renderTabs() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
    document.querySelectorAll('.tab-content').forEach(s => s.classList.toggle('active', s.id === ui.tab));
    document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === ui.sub));

    $('sub-week').classList.toggle('hidden', ui.sub !== 'week');
    $('sub-reset').classList.toggle('hidden', ui.sub !== 'reset');

    const gc = Object.values(S.grocery).filter(g => !g.archived && !g.checked).length;
    const c = $('groceryCount'); c.textContent = gc; c.classList.toggle('hidden', !gc);
  }
  function renderHint() {
    $('dumpHint').textContent = sample ? 'Claude sorts it into tasks, groceries and ideas. You review before anything is added.'
      : 'Sorted with simple rules here. You review before anything is added.';
  }

  function taskRow(t, opts = {}) {
    const done = t.status === 'done';
    const metaBits = [];
    if (t.time) metaBits.push(esc(t.time));
    if (opts.showDate && t.date) metaBits.push(esc(dayLabel(t.date)));
    if (t.status === 'doing' && !opts.board) metaBits.push('in progress');
    const badges = [];
    const from = t.date && t.date < today() ? t.date : (t.originalDate && t.date && t.originalDate < t.date ? t.originalDate : null);
    if (from && !done) badges.push(`<span class="badge">from ${esc(dayLabel(from))}</span>`);
    if (t.projectId && opts.showProject !== false && S.projects[t.projectId]) badges.push(`<span class="badge proj">${esc(projName(t.projectId))}</span>`);
    const acts = [];
    if (!done && opts.today) acts.push(`<button class="mini" data-act="to-today" data-id="${esc(t.id)}">Today</button>`);
    if (!done && opts.tomorrow !== false) acts.push(`<button class="mini" data-act="to-tomorrow" data-id="${esc(t.id)}" aria-label="Move to tomorrow">Tmrw</button>`);
    if (!done && opts.drop) acts.push(`<button class="mini ghost" data-act="drop" data-id="${esc(t.id)}" aria-label="Drop task">✕</button>`);
    const handle = opts.board ? dragHandle(t, opts.board) : '';
    return `<div class="task-item ${done ? 'done' : ''}" ${opts.board ? `data-drag-id="${esc(t.id)}"` : ''} style="border-left-color:${catColor(t.category)}">

      <span class="text"><span class="t">${badges.join('')}${esc(t.title)}</span>${metaBits.length ? `<span class="meta">${metaBits.join(' · ')}</span>` : ''}</span>
      ${acts.join('')}
    </div>`;
  }

  function renderWaiting() {
    const waiting = Object.values(S.dumps).filter(d => !d.processed && (!review || review.dumpId !== d.id)).sort((a, b) => a.createdAt - b.createdAt);
    $('waitingBox').innerHTML = waiting.length ? `<div class="card"><h2>📥 Brain dumps to sort (${waiting.length})</h2>
      ${waiting.map(d => `<div class="note-item"><span>${d.source === 'shortcut' ? '📱 ' : ''}${esc(d.text.length > 140 ? d.text.slice(0, 140) + '…' : d.text)}</span>
        <button class="mini primary" data-act="dump-retry" data-id="${esc(d.id)}">Sort</button>
        <button class="mini ghost" data-act="dump-dismiss" data-id="${esc(d.id)}" aria-label="Dismiss">${confirmKey === 'dd-' + d.id ? 'Sure?' : '✕'}</button></div>`).join('')}
    </div>` : '';
  }

  function renderCarry() {

    $('carryBox').innerHTML = `<div class="card carry carry-bar">
      <span>↪ ${carry.length} carried over. ${carry.length === 1 ? 'It\'s' : 'They\'re'} in Today with a “from” tag.${capMode() === 'survival' ? ' No pressure today.' : ''}</span>
      <span style="display:flex;gap:6px"><button class="mini" data-act="carry-all-today">All to today</button><button class="mini" data-act="carry-drop-all">${confirmKey === 'carry-drop' ? 'Tap again' : 'Drop all'}</button></span></div>`;
  }

  function renderToday() {
    const b = board();
    if (!b.todo.length && !b.doing.length && !b.done.length) {
      $('todayList').innerHTML = (capMode() === 'survival' ? '<div class="empty">Nothing essential left today. Rest counts.</div>' : '<div class="empty">Nothing scheduled for today yet. Brain dump below or add one in Schedule.</div>') + pausedHtml();
      return;
    }
    const rowOpts = t => ({ board: 'home', drop: t.date && t.date < today(), tomorrow: t.status !== 'done' });
    const group = (col, emptyText) => `<div class="grp-h"><span>${COL_LABEL[col]}</span><span>${b[col].length}</span></div>
      <div class="drop" data-drop="${col}" data-board="home">${b[col].map(t => taskRow(t, rowOpts(t))).join('') || `<div class="empty">${emptyText}</div>`}</div>`;
    $('todayList').innerHTML = group('doing', 'Drag a task here to start it.') + group('todo', 'All clear.') + group('done', 'Finished tasks stay here, grayed out.') + pausedHtml();

  }

  function renderSuggest() {
    const { carry, todayOpen, anytime } = views();
    const out = [];
    const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes();
    const next = todayOpen.find(t => t.time && timeMin(t.time) < 9000 && timeMin(t.time) >= nowMin);

  function buildPrompt(text) {
    const td = today();
    const projects = Object.values(S.projects).map(p => `${p.id}: ${p.name}`).join('\n') || '(none)';
    const open = Object.values(S.tasks).filter(isOpen).slice(0, 120).map(t => `${t.id}: ${t.title}`).join('\n') || '(none)';
    return `You organize a busy mom's brain dump into structured items for her personal dashboard.
Today is ${parseYmd(td).toLocaleDateString('en-US', { weekday: 'long' })} ${td}.
Household: Farah (mom), Omar (husband), sons Hamad (4.5), Talal (3), Yousef (6 months).
Categories: kids, work, home, errands, self, activity, omar.
Grocery stores: ${stores().join(', ')}.
Existing projects (id: name):
${projects}
Tasks already open on her list (id: title):
${open}

Brain dump:
"""
${text}
"""

Return ONLY a JSON object, no other text:
{"tasks":[{"title":string,"category":string,"projectId":string|null,"newProject":string|null,"date":"YYYY-MM-DD"|null,"time":"h:mm AM"|null,"duplicateOf":string|null}],
 "grocery":[{"item":string,"store":string}],
 "ideas":[{"text":string,"projectId":string|null}]}

Rules:
- Split into separate items. Keep her wording; short titles, starting with a verb where natural.
- Food and household consumables to buy (yogurt, diapers, wipes, chicken) go in "grocery". Use the store she named; otherwise the most likely of the listed stores; otherwise "Other". A bare store name like "Costco" with nothing else is an errands task.
- Non-grocery purchases (shoes, gifts) are errands tasks.
- Link to an existing project by id when the item clearly belongs to it. Use "newProject" only for a clearly new ongoing body of work.
- Dates: set only when stated or clearly implied. If the dump is labelled for a day ("brain dump Thursday") or says today, use that date for its tasks. Resolve "tomorrow" and weekday names to the next such date. Otherwise null.
- Time only when she states one. Never invent details.
- "duplicateOf": the id of an open task that means the same thing, else null.
- Ideas are things to remember that aren't actions yet.`;
  }

  const GROCERY_WORDS = /\b(yogh?urt|milk|eggs?|bread|berr(y|ies)|blueberr|strawberr|chicken|beef|turkey|fish|rice|cheese|fruit|apples?|bananas?|grapes|water|oil|diapers?|wipes|formula|puffs|pasta|tomato|onions?|garlic|potato|cucumber|lettuce|spinach|butter|labneh|hummus|zaatar|za'atar|olive|dates|flour|sugar|cereal|oats|snacks?|juice|coffee|tea|paper towels?|toilet paper|detergent|soap|shampoo)\b/i;
  const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  function guessCategory(s) {
    if (/\bomar\b/i.test(s)) return 'omar';
    if (/hamad|talal|yousef|yusuf|\bkids?\b|school|daycare|pediatric|diaper|nap|\brms\b|\bot\b|soccer|nanny/i.test(s)) return 'kids';
    if (/workwave|\bwork\b|email|portfolio|course|meeting|interview|onboard|resume/i.test(s)) return 'work';
    if (/shower|workout|gym|\bread\b|rest\b|sleep|walk|pray|nails|hair/i.test(s)) return 'self';
    if (/park|library|museum|outing|picking|play ?date|class\b|zoo/i.test(s)) return 'activity';
    if (/\bcall\b|walgreens|pharmacy|pick ?up|drop ?off|\border\b|\bbuy\b|return|post office|bank|appointment|costco|target|walmart|aldi|amazon/i.test(s)) return 'errands';
    return 'home';
  }
  function guessDate(s, dumpDate) {
    const l = s.toLowerCase(); const td = today();
    if (/\btomorrow\b/.test(l)) return addDays(td, 1);
    if (/\btoday\b|\btonight\b|this morning/.test(l)) return td;
    for (let i = 0; i < 7; i++) {
      if (new RegExp('\\b' + WEEKDAYS[i] + '\\b').test(l)) { const cur = new Date().getDay(); const diff = (i - cur + 7) % 7; return addDays(td, diff); }
    }
    return dumpDate;
  }
  function localParse(text) {
    let s = String(text);
    let dumpDate = null;
    const head = s.match(/^\s*brain\s*dump\s*([a-z]*)\s*:/i);
    if (head) { dumpDate = guessDate(head[1] || '', null) || today(); s = s.slice(head[0].length); }
    const parts = s.split(/\n|,|;|•|\.\s+/).map(x => x.trim().replace(/^[-*\d.)\s]+/, '').replace(/\.$/, '')).filter(x => x.length > 1);
    const storeList = stores();
    const out = { tasks: [], grocery: [], ideas: [] };
    parts.forEach(p => {
      const storeHit = storeList.find(st => p.toLowerCase().includes(st.toLowerCase()));
      const bare = storeHit && norm(p) === norm(storeHit);
      if (!bare && (GROCERY_WORDS.test(p) && !/\b(call|order shoes|clean|fold)\b/i.test(p))) {
        const item = p.replace(/^(buy|get|grab|need|pick up|order)\s+/i, '').replace(new RegExp('\\s*(at|from|to|@)?\\s*' + (storeHit || '\\b\\B') + '\\b', 'i'), '').trim();
        item.split(/\s+and\s+/i).forEach(it => { if (it) out.grocery.push({ item: it, store: storeHit || 'Other' }); });
        return;
      }
      if (/^(idea|maybe|someday|remember)\b[:\s]/i.test(p)) { out.ideas.push({ text: p.replace(/^(idea|maybe|someday|remember)\b[:\s]*/i, ''), projectId: null }); return; }
      const proj = Object.values(S.projects).find(pr => {
        const words = norm(pr.name).split(' ').filter(w => w.length > 3 && !['game', 'project', 'with', 'outing'].includes(w));
        return words.some(w => norm(p).includes(w));
      });
      out.tasks.push({ title: bare ? `${storeHit} run` : p.charAt(0).toUpperCase() + p.slice(1), category: proj ? (proj.category || guessCategory(p)) : guessCategory(p),
        projectId: proj ? proj.id : null, newProject: null, date: guessDate(p, dumpDate), time: null, duplicateOf: null });
    });
    return out;
  }
  function normalizeReview(raw, dumpId, how) {
    const storeList = stores();
    const openByNorm = new Map(Object.values(S.tasks).filter(isOpen).map(t => [norm(t.title), t]));
    const dateOk = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null;
    const tasks = (Array.isArray(raw.tasks) ? raw.tasks : []).filter(t => t && t.title).map(t => {
      const dup = (t.duplicateOf && S.tasks[t.duplicateOf] && isOpen(S.tasks[t.duplicateOf])) ? S.tasks[t.duplicateOf] : openByNorm.get(norm(t.title));
      return { title: String(t.title).trim(), category: CATS[t.category] ? t.category : guessCategory(t.title),
        projectId: t.projectId && S.projects[t.projectId] ? t.projectId : null,
        newProject: !t.projectId && t.newProject ? String(t.newProject).trim() : null,
        date: dateOk(t.date), time: t.time ? String(t.time) : null, dupOf: dup ? dup.title : null, include: !dup };
    });
    const grocery = (Array.isArray(raw.grocery) ? raw.grocery : []).filter(g => g && g.item).map(g => {
      const store = storeList.find(s => s.toLowerCase() === String(g.store || '').toLowerCase()) || 'Other';
      const dup = Object.values(S.grocery).some(x => !x.archived && !x.checked && x.store === store && norm(x.item) === norm(g.item));
      return { item: String(g.item).trim(), store, dup, include: !dup };
    });
    const ideas = (Array.isArray(raw.ideas) ? raw.ideas : []).filter(i => i && i.text).map(i => ({
      text: String(i.text).trim(), projectId: i.projectId && S.projects[i.projectId] ? i.projectId : null, include: true }));
    return { dumpId, how, tasks, grocery, ideas, loading: false };
  }
  async function sortDump(dump) {
    review = { dumpId: dump.id, loading: true }; render();
    let raw = null, how = 'rules';
    if (sample) {
      try { raw = await sample.json(buildPrompt(dump.text), { modelTier: 'quick' }); how = 'claude'; }
      catch (e) { if (e && e.code === 'not_granted') { sample = null; } raw = null; }
    }
    if (!raw || typeof raw !== 'object') { raw = localParse(dump.text); how = 'rules'; }
    if (!review || review.dumpId !== dump.id) return;
    review = normalizeReview(raw, dump.id, how);
    render();
  }
  function commitReview() {
    if (!review || review.loading) return;
    const madeProjects = {};
    review.tasks.filter(t => t.include && t.title).forEach(t => {
      let pid = t.projectId;
      if (!pid && t.newProject) {
        const key = norm(t.newProject);
        const existing = Object.values(S.projects).find(p => norm(p.name) === key);
        if (existing) pid = existing.id;
        else if (madeProjects[key]) pid = madeProjects[key];
        else { const p = { id: newId('p'), name: t.newProject, category: t.category, status: 'active', notes: '', createdAt: Date.now() }; stage('projects', p); pid = madeProjects[key] = p.id; }
      }
      stage('tasks', makeTask({ title: t.title, category: t.category, projectId: pid, date: t.date, time: t.time, source: 'brain-dump' }));
    });
    review.grocery.filter(g => g.include && g.item).forEach(g => {
      stage('grocery', { id: newId('g'), item: g.item, store: g.store, checked: false, archived: false, quantity: null, notes: '', createdAt: Date.now() });
    });
    review.ideas.filter(i => i.include && i.text).forEach(i => {
      stage('notes', { id: newId('n'), text: i.text, projectId: i.projectId || null, createdAt: Date.now() });
    });
    const d = S.dumps[review.dumpId];
    if (d) stage('dumps', Object.assign({}, d, { processed: true, processedAt: Date.now() }));
    review = null;
    commit();
  }
