<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farah Master Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #2c3e50; --accent: #667eea; --pink: #f295b0; --pink-dark: #f06b9d;
  --kids: #EC7A74; --home: #6C7FE0; --work: #F0A93B; --errands: #6E4FA3; --self: #8B7DC8; --activity: #5CAE5A; --omar: #FF6B6B;
  --border: #e0e0e0; --bg: #fafafa; --card: #ffffff; --text: #2c3e50; --body: #333; --muted: #666; --faint: #999;
  --soft: #f3f4fb; --carry: #fff9e6; --carry-line: #f0d48a; --chip: #eef0fb;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #e6e9f2; --border: #343849; --bg: #15171f; --card: #1d2029; --text: #e6e9f2; --body: #d9dce6;
    --muted: #a3a8b8; --faint: #7d8396; --soft: #232738; --carry: #2c2817; --carry-line: #6b5a25; --chip: #2a2e45;
  }
}
:root[data-theme="dark"] {
  --primary: #e6e9f2; --border: #343849; --bg: #15171f; --card: #1d2029; --text: #e6e9f2; --body: #d9dce6;
  --muted: #a3a8b8; --faint: #7d8396; --soft: #232738; --carry: #2c2817; --carry-line: #6b5a25; --chip: #2a2e45;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  padding: 16px 16px 96px; max-width: 760px; margin: 0 auto; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 16px; color: var(--body); background: var(--card); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); font-size: 12px; }
.hidden { display: none !important; }

/* HEADER */
.header { margin-bottom: 16px; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.header-top h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
.sync { font-size: 11px; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
.sync.warn { color: #9a6a00; border-color: var(--carry-line); background: var(--carry); }
.weather-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
.weather-header .day { font-size: 12px; opacity: .9; margin-bottom: 2px; }
.weather-header .date { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.weather-header .condition { font-size: 11px; opacity: .85; }
.dress-code { background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%); color: #fff; padding: 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
.dress-code .dc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.dress-code strong { font-size: 13px; }
.dc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dc-box { text-align: center; padding: 10px; background: rgba(255,255,255,.2); border-radius: 6px; }
.dc-box .who { font-size: 12px; font-weight: 700; }
.dc-box .what { font-size: 11px; margin-top: 4px; }
.dc-box input { width: 100%; margin-top: 6px; padding: 6px; border-radius: 4px; border: none; font-size: 14px; color: #2c3e50; background: #fff; }
.link-btn { background: rgba(255,255,255,.25); border: none; color: #fff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 4px; cursor: pointer; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.tab-btn { padding: 12px 12px 10px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--accent); }
.tab-btn .count { display: inline-block; min-width: 16px; font-size: 10px; background: var(--chip); color: var(--accent); border-radius: 999px; padding: 0 5px; margin-left: 4px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.sub-tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.sub-tab-btn.active { color: var(--primary); border-bottom-color: var(--accent); }

/* CARD */
.card { background: var(--card); border-radius: 8px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
.card h2 { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 { font-size: 12px; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
.card.carry { background: var(--carry); border-color: var(--carry-line); }

/* BRAIN DUMP */
.dump textarea { width: 100%; min-height: 96px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; resize: vertical; line-height: 1.5; }
.dump .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.dump .row .muted { flex: 1; font-size: 11px; }

/* TASK ROWS */
.task-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--accent); font-size: 14px; min-height: 44px; }
.task-item .text { flex: 1; color: var(--body); min-width: 0; overflow-wrap: anywhere; }
.task-item .meta { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }
.task-item.done { opacity: .5; }
.task-item.done .t { text-decoration: line-through; }
.carry .task-item { background: var(--card); }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--carry); color: #9a6a00; border: 1px solid var(--carry-line); margin-right: 4px; }
.badge.proj { background: var(--chip); color: var(--accent); border-color: transparent; }
.mini { flex: 0 0 auto; padding: 6px 8px; font-size: 11px; font-weight: 600; background: var(--card); color: var(--primary); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; min-height: 30px; }
.mini.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.mini.ghost { border-color: transparent; background: none; color: var(--faint); }
.toggle-line { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 6px 0; font-weight: 600; }
.empty { font-size: 12px; color: var(--faint); padding: 6px 2px; }

/* KEY TIMES / SUGGESTIONS */
.key-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--body); padding: 4px 0; border-bottom: 1px dashed var(--border); }
.key-row:last-of-type { border-bottom: none; }
.suggestions { background: linear-gradient(135deg, #f0f4ff 0%, #fff5f7 100%); padding: 12px; border-radius: 8px; border-left: 3px solid var(--accent); font-size: 13px; color: #2c3e50; line-height: 1.6; margin-bottom: 12px; }
.suggestions strong { display: block; margin-bottom: 4px; }
.suggestions div + div { margin-top: 6px; }

/* INPUT ROWS */
.add-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.add-row input[type="text"], .add-row select, .add-row input[type="time"] { flex: 1 1 140px; min-width: 0; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
.btn-add { padding: 10px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 40px; }
.btn-add.full { width: 100%; margin-top: 12px; }
.btn-add:disabled { opacity: .6; cursor: default; }
.btn-secondary { padding: 10px 14px; background: var(--bg); color: var(--primary); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 40px; }

/* REVIEW */
.review { border-color: var(--accent); }
.rv-sec { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 6px; }
.rv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; border-radius: 6px; background: var(--bg); margin-bottom: 6px; border-left: 3px solid var(--accent); }
.rv-row.off { opacity: .45; }
.rv-row input[type="text"] { flex: 1 1 160px; min-width: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; }
.rv-row select { padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }
.rv-note { flex-basis: 100%; font-size: 11px; color: var(--faint); padding-left: 26px; }
.rv-actions { display: flex; gap: 8px; margin-top: 10px; }
.rv-actions .btn-add { flex: 1; }

/* DONUT + STATUS */
.donut-container { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; }
.donut-svg { flex: 0 0 120px; width: 120px; height: 120px; }
.donut-legend { flex: 1; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 6px; color: var(--body); }
.legend-color { width: 12px; height: 12px; border-radius: 2px; }
.legend-count { font-weight: 700; color: var(--primary); }
.status-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.status-box { text-align: center; padding: 12px; background: var(--card); border-radius: 6px; border: 1px solid var(--border); }
.status-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.status-count { font-size: 28px; font-weight: 700; color: var(--primary); margin: 6px 0 0; }

/* KANBAN */
.kanban { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 680px) { .kanban { grid-template-columns: repeat(3, 1fr); } }
.kcol { background: var(--soft); border-radius: 8px; padding: 10px; }
.kcol h3 { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 8px; display: flex; justify-content: space-between; }
.kcard { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; color: var(--body); }
.kcard .meta { font-size: 11px; color: var(--faint); margin-top: 2px; }
.kcard .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.kcard.done { opacity: .55; }
.kcard.done .t { text-decoration: line-through; }

/* WEEK */
.week-day { padding: 12px; margin-bottom: 10px; background: var(--card); border-radius: 6px; border: 1px solid var(--border); border-left: 3px solid var(--accent); }
.week-day.is-today { border-left-color: var(--pink-dark); }
.week-day-title { font-weight: 700; color: var(--primary); font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; }
.week-line { font-size: 13px; color: var(--body); padding: 2px 0; display: flex; gap: 8px; align-items: baseline; }
.week-line .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; transform: translateY(-1px); }
.week-line.done { opacity: .5; text-decoration: line-through; }

/* ACCORDION */
.accordion-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 12px; cursor: pointer; background: var(--bg); border-radius: 6px; margin-bottom: 8px; font-weight: 600; color: var(--primary); font-size: 13px; border: 1px solid var(--border); min-height: 44px; }
.accordion-header .right { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: var(--muted); }
.accordion-header.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.accordion-header.active .right { color: #fff; }
.progress { width: 44px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--activity); }
.accordion-content { padding: 10px; background: var(--bg); border-radius: 6px; margin: -4px 0 10px; border: 1px solid var(--border); }
.accordion-content .task-item { background: var(--card); }
.note-item { font-size: 13px; color: var(--body); padding: 8px 10px; background: var(--card); border-radius: 6px; border-left: 3px dashed var(--self); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.note-item span { flex: 1; overflow-wrap: anywhere; }

/* GMAIL placeholder */
.not-connected { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.not-connected a { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
.weather-header .temp { font-size: 13px; font-weight: 600; margin-top: 6px; }
.head-right { display: flex; gap: 6px; align-items: center; }
a.sync { text-decoration: none; cursor: pointer; }
.mail-item { display: block; text-decoration: none; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--accent); min-height: 44px; }
.mail-item .subj { font-size: 14px; color: var(--body); overflow-wrap: anywhere; }
.mail-item .from { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; overflow-wrap: anywhere; }
.cal-item { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--accent); font-size: 14px; color: var(--body); }
.cal-item .when { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--accent); min-width: 64px; }
.cal-item .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.h2-link { font-size: 11px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }

@media (prefers-reduced-motion: no-preference) {
  .tab-btn, .sub-tab-btn, .accordion-header { transition: background-color .15s, color .15s, border-color .15s; }
}
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <h1>Farah</h1>
    <span class="head-right"><span id="sync" class="sync">Loading…</span><a class="sync" href="/api/auth/signout?callbackUrl=/">Sign out</a></span>
  </div>
  <div class="weather-header">
    <div class="day" id="dayName"></div>
    <div class="date" id="dateStr"></div>
    <div class="temp" id="weatherTemp"></div>
    <div class="condition" id="weatherLine">Loading Rochester weather…</div>
  </div>
  <div class="dress-code" id="dress"></div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn" data-act="tab" data-tab="home">HOME</button>
  <button class="tab-btn" data-act="tab" data-tab="schedule">SCHEDULE</button>
  <button class="tab-btn" data-act="tab" data-tab="projects">PROJECTS</button>
  <button class="tab-btn" data-act="tab" data-tab="grocery">GROCERY<span class="count hidden" id="groceryCount"></span></button>
</nav>

<!-- ======== HOME ======== -->
<section id="home" class="tab-content">
  <div class="card dump">
    <h2>🧠 Brain dump</h2>
    <textarea id="dumpText" placeholder="Everything on your mind: tasks, groceries, kid things, ideas. Messy is fine."></textarea>
    <div class="row">
      <span class="muted" id="dumpHint"></span>
      <button class="btn-add" data-act="organize">Organize it</button>
    </div>
  </div>
  <div id="reviewBox"></div>
  <div id="waitingBox"></div>
  <div id="carryBox"></div>
  <div id="calTodayBox"></div>
  <div class="card">
    <h2>📋 Today</h2>
    <div id="todayList"></div>
  </div>
  <div id="anytimeBox"></div>
  <div id="suggestBox"></div>
  <div class="card">
    <h2>⏱️ Key times</h2>
    <div id="keyTimes"></div>
    <div class="add-row">
      <input type="text" id="ktAdd" data-enter="kt-add" placeholder="Add a key time, e.g. 3:00 PM pickup">
    </div>
  </div>
  <div class="card">
    <h2><span>✉️ Action items</span><a class="h2-link" href="https://mail.google.com" target="_blank" rel="noopener">Open Gmail ↗</a></h2>
    <div id="gmailList"><div class="empty">Loading unread email…</div></div>
  </div>
</section>

<!-- ======== SCHEDULE ======== -->
<section id="schedule" class="tab-content">
  <div class="sub-tabs">
    <button class="sub-tab-btn" data-act="sub" data-sub="today">Today Kanban</button>
    <button class="sub-tab-btn" data-act="sub" data-sub="week">Week View</button>
  </div>
  <div id="sub-today">
    <div class="donut-container">
      <svg class="donut-svg" viewBox="0 0 120 120" id="donut" role="img" aria-label="Today's tasks by category"></svg>
      <div class="donut-legend" id="donutLegend"></div>
    </div>
    <div class="status-boxes">
      <div class="status-box"><div class="status-label">To Do</div><div class="status-count" id="countTodo">0</div></div>
      <div class="status-box"><div class="status-label">Delayed</div><div class="status-count" id="countDelayed">0</div></div>
      <div class="status-box"><div class="status-label">Done</div><div class="status-count" id="countDone">0</div></div>
    </div>
    <div class="card">
      <h2>＋ Add task</h2>
      <div class="add-row">
        <input type="text" id="ntTitle" data-enter="add-task" placeholder="What needs doing?">
      </div>
      <div class="add-row">
        <select id="ntCat" aria-label="Category"></select>
        <select id="ntDate" aria-label="Day">
          <option value="today">Today</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="none">No date</option>
        </select>
        <input type="time" id="ntTime" aria-label="Time">
        <button class="btn-add" data-act="add-task">Add</button>
      </div>
    </div>
    <div class="kanban" id="kanban"></div>
  </div>
  <div id="sub-week">
    <p class="muted" style="margin-bottom:10px">Your dashboard tasks and Google Calendar events for the next 7 days.</p>
    <div id="weekList"></div>
  </div>
</section>

<!-- ======== PROJECTS ======== -->
<section id="projects" class="tab-content">
  <div class="card">
    <h2>🎯 Projects</h2>
    <div id="projectsList"></div>
    <div class="add-row">
      <input type="text" id="npName" data-enter="add-project" placeholder="New project name">
      <button class="btn-add" data-act="add-project">Add</button>
    </div>
  </div>
  <div class="card">
    <h2>💡 Ideas</h2>
    <div id="ideasList"></div>
    <div class="add-row">
      <input type="text" id="niText" data-enter="add-idea" placeholder="Something to remember, not a task">
    </div>
  </div>
</section>

<!-- ======== GROCERY ======== -->
<section id="grocery" class="tab-content">
  <div class="card">
    <h2>🛒 Quick add</h2>
    <div class="add-row">
      <input type="text" id="gQuick" data-enter="groc-quick" placeholder="yogurt, berries to Costco">
      <select id="gStore" aria-label="Store"></select>
      <button class="btn-add" data-act="groc-quick">Add</button>
    </div>
  </div>
  <div class="card">
    <h2>🏬 Stores</h2>
    <div id="groceryList"></div>
    <div class="add-row">
      <input type="text" id="nsName" data-enter="add-store" placeholder="Add a store">
    </div>
  </div>
</section>

<script>
(() => {
  'use strict';

  // ---------- constants ----------
  const CATS = {
    kids: { label: 'Kids', color: '#EC7A74' }, work: { label: 'Work', color: '#F0A93B' },
    home: { label: 'Home', color: '#6C7FE0' }, errands: { label: 'Errands', color: '#6E4FA3' },
    self: { label: 'Self', color: '#8B7DC8' }, activity: { label: 'Activity', color: '#5CAE5A' },
    omar: { label: 'Omar', color: '#FF6B6B' }
  };
  const CAT_KEYS = Object.keys(CATS);
  const DEFAULT_STORES = ['Costco', "Trader Joe's", 'Target', 'Walmart', 'Amazon', 'Aldi', 'Other'];
  const STORE_ICON = { 'Costco': '🏬', "Trader Joe's": '🛍️', 'Target': '🎯', 'Walmart': '🛒', 'Amazon': '📦', 'Aldi': '🥕', 'Other': '📝' };
  const KINDS = ['tasks', 'projects', 'grocery', 'notes', 'dumps', 'meta'];
  const LS = { cache: 'fmd4-cache', pending: 'fmd4-pending', ui: 'fmd4-ui', draft: 'fmd4-draft', migrated: 'fmd4-migrated-v3' };

  // ---------- small helpers ----------
  const $ = id => document.getElementById(id);
  const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => ymd(new Date());
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const x = parseYmd(s); x.setDate(x.getDate() + n); return ymd(x); };
  const dayLabel = s => {
    const t = today();
    if (s === t) return 'Today';
    if (s === addDays(t, 1)) return 'Tomorrow';
    if (s === addDays(t, -1)) return 'Yesterday';

  let mode = 'starting';                          // 'cloud' | 'local'
  const srv = { tasksOpen: {}, tasksClosed: {}, projects: {}, grocery: {}, notes: {}, dumps: {}, meta: {} };
  const firstSeen = new Set();
  let migrated = false, flushing = false, flushTimer = null, writeError = '';
  let review = null, editDress = false, confirmKey = null, confirmTimer = null;
  let lastDay = today();

  const saveUi = () => lsSet(LS.ui, ui);
  const saveCache = () => lsSet(LS.cache, S);
  const savePending = () => lsSet(LS.pending, pending);

  // ---------- writes: one path for every change ----------
  function stage(kind, obj) {
    obj.updatedAt = Date.now();
    S[kind][obj.id] = obj;
    pending[kind + '/' + obj.id] = obj;
  }
  function unstage(kind, id) {
    delete S[kind][id];
    pending[kind + '/' + id] = null;
  }
  function commit() { savePending(); saveCache(); render(); scheduleFlush(); }
  function put(kind, obj) { stage(kind, obj); commit(); }

  function scheduleFlush(delay = 300) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, delay); }
  const refFor = key => { const i = key.indexOf('/'); return db.doc(`${base}/${key.slice(0, i)}/${key.slice(i + 1)}`); };

  async function flush() {
    if (mode !== 'cloud' || flushing) return;
    const keys = Object.keys(pending);
    if (!keys.length) { renderSync(); return; }
    flushing = true; renderSync();
    let retryLater = false;
    const sent = {}; keys.forEach(k => { sent[k] = pending[k]; });
    try {
      const writes = keys.map(k => { const i = k.indexOf('/'); return { kind: k.slice(0, i), id: k.slice(i + 1), data: sent[k] === null ? null : clone(sent[k]) }; });
      for (let i = 0; i < writes.length; i += 200) {
        const r = await fetch('/api/store', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ writes: writes.slice(i, i + 200) }) });
        if (r.status === 401) { writeError = 'Signed out: changes kept on this device'; break; }
        if (!r.ok) throw new Error('http ' + r.status);
      }
      if (!writeError) {
        keys.forEach(k => {
          if (pending[k] === sent[k]) {
            const i = k.indexOf('/'); const kind = k.slice(0, i); const id = k.slice(i + 1);
            if (!srvAll[kind]) srvAll[kind] = {};
            if (sent[k] === null) delete srvAll[kind][id]; else srvAll[kind][id] = sent[k];
            delete pending[k];
          }
        });
        savePending();
      }
    } catch (e) {
      writeError = 'Offline: saved on this device, will sync'; retryLater = true;
    } finally {
      flushing = false;
      if (!retryLater && !Object.keys(pending).length) writeError = writeError.startsWith('Signed out') ? writeError : '';
      renderSync();
      if (retryLater) scheduleFlush(8000);
      else if (!writeError && Object.keys(pending).length) scheduleFlush();
    }
  }

  // ---------- reads: server snapshots + unsynced local changes ----------
  function applyServer() {
    const next = emptyState();
    next.tasks = Object.assign({}, srv.tasksClosed, srv.tasksOpen);
    ['projects', 'grocery', 'notes', 'dumps', 'meta'].forEach(k => { next[k] = Object.assign({}, srv[k]); });
    for (const [k, v] of Object.entries(pending)) {
      const i = k.indexOf('/'); const kind = k.slice(0, i); const id = k.slice(i + 1);
      if (!next[kind]) continue;
      if (v === null) delete next[kind][id]; else next[kind][id] = v;
    }
    S = next; saveCache(); render();
  }
  const snapMap = snap => { const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = Object.assign({}, d.data()); }); return m; };
  function subscribe(name, query) {
    query.onSnapshot(snap => {
      srv[name] = snapMap(snap); firstSeen.add(name); applyServer(); maybeMigrate();
    }, err => {
      console.warn('subscription', name, err);
      if (err && err.code === 'unavailable') setTimeout(() => subscribe(name, query), 4000);
    });
  }

  // ---------- live Google + weather data ----------
  const live = { weather: null, mail: null, cal: null, mailErr: '', calErr: '', authed: true };
  async function getJson(url) {
    const r = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401) { const e = new Error('auth'); e.auth = true; throw e; }
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }
  async function loadLive() {
    const jobs = [
      getJson('/api/weather').then(d => { if (!d.error) live.weather = d; }).catch(() => {}),
      getJson('/api/gmail').then(d => { live.mail = d.emails || []; live.mailErr = ''; })
        .catch(e => { if (e.auth) live.authed = false; else live.mailErr = 'Couldn\'t load Gmail right now.'; }),
      getJson('/api/calendar').then(d => { live.cal = d.events || []; live.calErr = ''; })
        .catch(e => { if (e.auth) live.authed = false; else live.calErr = 'Couldn\'t load your calendar right now.'; })
    ];
    await Promise.all(jobs);
    render();
  }
  const evDate = ev => ev.allDay ? String(ev.start).slice(0, 10) : ymd(new Date(ev.start));
  const evTime = ev => ev.allDay ? 'All day' : new Date(ev.start).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const evMin = ev => { if (ev.allDay) return -1; const d = new Date(ev.start); return d.getHours() * 60 + d.getMinutes(); };
  const eventsOn = d => (live.cal || []).filter(ev => evDate(ev) === d).sort((a, b) => evMin(a) - evMin(b));
  const signInHtml = what => `<div class="not-connected"><span>Sign in again to load ${what}.</span><a href="/">Sign in ↗</a></div>`;
  function renderLive() {
    const w = live.weather;
    $('weatherTemp').textContent = w ? `${w.temperature}°F · feels like ${w.feelsLike}°` : '';
    $('weatherLine').textContent = w ? `${w.condition} in Rochester, MN` : 'Loading Rochester weather…';
    let mh;
    if (!live.authed) mh = signInHtml('Gmail');
    else if (live.mailErr) mh = `<div class="empty">${esc(live.mailErr)}</div>`;
    else if (!live.mail) mh = '<div class="empty">Loading unread email…</div>';
    else if (!live.mail.length) mh = '<div class="empty">Inbox zero. No unread email.</div>';
    else mh = live.mail.map(m => `<a class="mail-item" href="https://mail.google.com/mail/u/0/#inbox/${encodeURIComponent(m.threadId || m.id)}" target="_blank" rel="noopener"><span class="subj">${esc(m.subject)}</span>${m.from ? `<span class="from">${esc(m.from)}</span>` : ''}</a>`).join('');
    $('gmailList').innerHTML = mh;
    const evs = eventsOn(today());
    let ch = '';
    if (!live.authed) ch = signInHtml('your calendar');
    else if (live.calErr) ch = `<div class="empty">${esc(live.calErr)}</div>`;
    else if (live.cal && evs.length) ch = evs.map(ev => `<div class="cal-item"${ev.color ? ` style="border-left-color:${esc(ev.color)}"` : ''} title="${esc(ev.calendar || '')}"><span class="when">${esc(evTime(ev))}</span><span class="what">${esc(ev.title || '(No title)')}</span></div>`).join('');
    else if (live.cal) ch = '<div class="empty">Nothing on your calendar today.</div>';
    $('calTodayBox').innerHTML = ch ? `<div class="card"><h2><span>📅 Calendar today</span><a class="h2-link" href="https://calendar.google.com" target="_blank" rel="noopener">Open ↗</a></h2>${ch}</div>` : '';
  }

  async function init() {
    wireEvents();
    render();
    loadLive();
    setInterval(loadLive, 10 * 60000);
    setInterval(checkDay, 60000);
    document.addEventListener('visibilitychange', checkDay);
    $('dumpText').value = lsGet(LS.draft, '') || '';

    goLocal();
    await loadCloud();
    setInterval(() => { if (!document.hidden) loadCloud(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCloud(); });
  }

  // ---------- cloud sync through /api/store (Supabase) ----------
  let srvAll = emptyState(), loadingCloud = false, cloudNote = '';
  async function loadCloud() {
    if (loadingCloud || flushing) return;
    loadingCloud = true;
    try {
      const r = await fetch('/api/store', { credentials: 'same-origin', cache: 'no-store' });
      if (r.status === 401) { cloudNote = 'Signed out: saved on this device'; return; }
      if (r.status === 503) { cloudNote = 'Sync not set up: saved on this device'; return; }
      if (!r.ok) { cloudNote = 'Offline: saved on this device'; return; }
      const data = await r.json();
      const next = emptyState();
      KINDS.forEach(k => { next[k] = (data.docs && data.docs[k]) || {}; });
      const serverEmpty = KINDS.every(k => !Object.keys(next[k]).length);
      if (serverEmpty && mode !== 'cloud') {
        // First device to sync uploads what it already has.
        KINDS.forEach(k => Object.values(S[k]).forEach(o => { if (o && o.id) pending[k + '/' + o.id] = o; }));
        savePending();
      }
      srvAll = next; cloudNote = ''; mode = 'cloud';
      applyCloud();
      scheduleFlush(0);
    } catch (e) {
      cloudNote = 'Offline: saved on this device';
    } finally {
      loadingCloud = false; renderSync();
    }
  }
  function applyCloud() {
    const next = emptyState();
    KINDS.forEach(k => { next[k] = Object.assign({}, srvAll[k]); });
    for (const [k, v] of Object.entries(pending)) {
      const i = k.indexOf('/'); const kind = k.slice(0, i); const id = k.slice(i + 1);
      if (!next[kind]) continue;
      if (v === null) delete next[kind][id]; else next[kind][id] = v;
    }
    S = next; saveCache(); render();
  }
  function goLocal() { mode = 'local'; render(); maybeMigrate(true); }

  function checkDay() {
    if (today() !== lastDay) { lastDay = today(); render(); }
  }

  // ---------- one-time import from Dashboard v3 storage on this device ----------
  function maybeMigrate(force) {
    if (migrated) return;
    if (!force && !['tasksOpen', 'tasksClosed', 'projects', 'grocery', 'meta'].every(n => firstSeen.has(n))) return;
    migrated = true;
    try { migrateV3(); } catch (e) { console.warn('migration', e); }
  }
  function migrateV3() {
    if (lsGet(LS.migrated, false)) return;
    let touched = false;

    // Tasks: v3 kept one list per day. Group by title; the latest day decides done/open.
    const keys = Object.keys(localStorage).filter(k => k.startsWith('fmd-tasks-v3-')).sort();
    const groups = new Map();
    keys.forEach(k => {
      const date = k.slice('fmd-tasks-v3-'.length);
      let arr = [];
      try { arr = JSON.parse(localStorage.getItem(k)) || []; } catch (e) {}
      arr.forEach(t => {
        const title = String(t.text || '').trim(); if (!title) return;
        const key = norm(title);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ date, t, title });
      });
    });
    const openTitles = new Set(Object.values(S.tasks).filter(isOpen).map(t => norm(t.title)));
    groups.forEach((entries, key) => {
      entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      // keep every completed instance as history (one per day)
      const seenDoneDays = new Set();
      entries.filter(e => e.t.done).forEach(e => {
        if (seenDoneDays.has(e.date)) return; seenDoneDays.add(e.date);
        const id = `m3-${e.date}-${String(e.t.id).replace(/[^\w-]/g, '')}`;
        if (S.tasks[id]) return;
        const at = parseYmd(e.date); at.setHours(12);
        stage('tasks', { id, title: e.title, category: CATS[e.t.category] ? e.t.category : 'home', projectId: null, date: e.date, time: e.t.time || null,
          duration: null, priority: null, status: 'done', notes: '', createdAt: at.getTime(), completedAt: at.getTime(), source: 'migrated-v3' });
        touched = true;
      });
      const last = entries[entries.length - 1];
      if (last.t.done || openTitles.has(key)) return;
      // open: carried from the first undone day after the last completion
      let lastDoneIdx = -1; entries.forEach((e, i) => { if (e.t.done) lastDoneIdx = i; });
      const first = entries[lastDoneIdx + 1];
      const id = `m3-${first.date}-${String(first.t.id).replace(/[^\w-]/g, '')}`;
      if (S.tasks[id]) return;
      stage('tasks', { id, title: first.title, category: CATS[first.t.category] ? first.t.category : 'home', projectId: null, date: first.date,
        time: first.t.time || null, duration: null, priority: null, status: 'todo', notes: '', createdAt: parseYmd(first.date).getTime(), completedAt: null, source: 'migrated-v3' });
      openTitles.add(key); touched = true;
    });

    // Projects: merge v3 subtasks into same-named projects.
    const oldProjects = lsGet('fmd-projects-v3', null);
    if (Array.isArray(oldProjects)) {
      const SUMMER_OLD = ['plan summer activities', 'book camps outings', 'prepare budget'];
      oldProjects.forEach(op => {
        let name = String(op.name || '').trim(); if (!name) return;
        const isSummer = /summer\s*2026/i.test(name);
        if (isSummer) name = '☀️ Summer 2026 Picture Book';
        const plain = norm(name);
        let p = Object.values(S.projects).find(x => norm(x.name) === plain || (isSummer && /summer 2026/.test(norm(x.name))));
        if (!p) { p = { id: newId('p'), name, category: 'self', status: 'active', notes: '', createdAt: Date.now() }; stage('projects', p); touched = true; }
        (op.tasks || []).forEach(title => {
          if (isSummer && SUMMER_OLD.includes(norm(title))) return;
          const exists = Object.values(S.tasks).some(t => t.projectId === p.id && norm(t.title) === norm(title));
          if (exists) return;
          stage('tasks', { id: newId('t'), title: String(title), category: p.category || 'self', projectId: p.id, date: null, time: null, duration: null,
            priority: null, status: 'todo', notes: '', createdAt: Date.now(), completedAt: null, source: 'migrated-v3' });
          touched = true;
        });
      });
    }

    // Grocery: v3 items were never checkable, so all come in unchecked.
    const oldGrocery = lsGet('fmd-grocery-v3', null);
    if (Array.isArray(oldGrocery)) {
      oldGrocery.forEach(g => {
        const store = String(g.name || '').replace(/^[^\p{L}\p{N}]+/u, '').trim() || 'Other';
        (g.items || []).forEach(item => {
          const dup = Object.values(S.grocery).some(x => !x.archived && x.store === store && norm(x.item) === norm(item));
          if (dup) return;
          stage('grocery', { id: newId('g'), item: String(item), store, checked: false, archived: false, quantity: null, notes: '', createdAt: Date.now() });
          touched = true;
        });
        if (!stores().includes(store)) { setMetaStaged({ stores: [...stores(), store] }); touched = true; }
      });
    }

    lsSet(LS.migrated, true);
    if (touched) commit();
  }

  // ---------- domain helpers ----------
  const meta = () => S.meta.main || {};
  function setMetaStaged(patch) { stage('meta', Object.assign({ id: 'main' }, clone(meta()), patch)); }
  function setMeta(patch) { setMetaStaged(patch); commit(); }
  function stores() {
    const list = Array.isArray(meta().stores) && meta().stores.length ? meta().stores.slice() : DEFAULT_STORES.slice();
    Object.values(S.grocery).forEach(g => { if (!g.archived && g.store && !list.includes(g.store)) list.push(g.store); });
    return list;
  }
  function makeTask(f) {
    return { id: newId('t'), title: f.title, category: CATS[f.category] ? f.category : 'home', projectId: f.projectId || null,
      date: f.date || null, time: f.time || null, duration: null, priority: null, status: 'todo', notes: '',
      createdAt: Date.now(), completedAt: null, source: f.source || 'manual' };
  }
  function setTask(id, patch) {
    const t = S.tasks[id]; if (!t) return;
    const n = Object.assign({}, t, patch);
    if (patch.status === 'done' && t.status !== 'done') n.completedAt = Date.now();
    if (patch.status && patch.status !== 'done') n.completedAt = null;
    put('tasks', n);
  }
  function moveTo(id, date) {
    const t = S.tasks[id]; if (!t) return;
    setTask(id, { date, originalDate: t.originalDate || t.date || null, status: t.status === 'dropped' ? 'todo' : t.status });
  }
  function views() {
    const td = today(); const all = Object.values(S.tasks);
    return {
      td,
      carry: all.filter(t => isOpen(t) && t.date && t.date < td).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byTime(a, b)),
      todayOpen: all.filter(t => isOpen(t) && t.date === td).sort(byTime),
      anytime: all.filter(t => isOpen(t) && !t.date && !t.projectId).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)),
      doneToday: all.filter(t => t.status === 'done' && t.completedAt && ymd(new Date(t.completedAt)) === td).sort((a, b) => b.completedAt - a.completedAt)
    };
  }
  const projName = id => { const p = S.projects[id]; return p ? p.name : ''; };

  // ---------- render ----------
  function render() {
    const keep = rememberFocus();
    renderHeader(); renderTabs(); renderHint(); renderSync();
    renderReview(); renderWaiting(); renderCarry(); renderToday(); renderAnytime(); renderSuggest(); renderKeyTimes();
    renderSchedule(); renderWeek(); renderProjects(); renderIdeas(); renderGrocery(); renderLive();
    restoreFocus(keep);
  }
  function rememberFocus() {
    const a = document.activeElement;
    if (!a || !a.id || !/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return null;
    return { id: a.id, value: a.value, s: a.selectionStart, e: a.selectionEnd };
  }
  function restoreFocus(k) {
    if (!k) return; const el = $(k.id); if (!el || el === document.activeElement) return;
    el.value = k.value; el.focus();
    try { if (k.s != null) el.setSelectionRange(k.s, k.e); } catch (e) {}
  }

  function renderSync() {
    const el = $('sync'); const n = Object.keys(pending).length;
    el.classList.remove('warn');
    if (writeError) { el.textContent = writeError; el.classList.add('warn'); }
    else if (mode === 'starting') el.textContent = 'Loading…';
    else if (mode === 'local' && cloudNote) { el.textContent = cloudNote; el.classList.add('warn'); }
    else if (mode === 'local') el.textContent = 'Connecting…';
    else if (n || flushing) el.textContent = 'Saving…';
    else el.textContent = '✓ Synced';
  }
  function renderHeader() {
    const d = new Date();
    $('dayName').textContent = d.toLocaleDateString('en-US', { weekday: 'long' });
    $('dateStr').textContent = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    const dc = meta().dress || {};
    const big = dc.big || ''; const baby = dc.baby || '';
    $('dress').innerHTML = `
      <div class="dc-top"><strong>👕 Today's dress code</strong><button class="link-btn" data-act="dress-edit">${editDress ? 'Done' : 'Edit'}</button></div>
      <div class="dc-grid">
        <div class="dc-box"><div class="who">Hamad & Talal</div>${editDress ? `<input id="dcBig" value="${esc(big)}" placeholder="e.g. sweatshirt + light jacket">` : `<div class="what">${esc(big || 'Tap Edit to set')}</div>`}</div>
        <div class="dc-box"><div class="who">Yousef</div>${editDress ? `<input id="dcBaby" value="${esc(baby)}" placeholder="e.g. onesie + fleece + hat">` : `<div class="what">${esc(baby || 'Tap Edit to set')}</div>`}</div>
      </div>`;
  }
  function renderTabs() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
    document.querySelectorAll('.tab-content').forEach(s => s.classList.toggle('active', s.id === ui.tab));
    document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === ui.sub));
    $('sub-today').classList.toggle('hidden', ui.sub !== 'today');
    $('sub-week').classList.toggle('hidden', ui.sub !== 'week');
    const gc = Object.values(S.grocery).filter(g => !g.archived && !g.checked).length;
    const c = $('groceryCount'); c.textContent = gc; c.classList.toggle('hidden', !gc);
  }
  function renderHint() {
    $('dumpHint').textContent = sample ? 'Claude sorts it into tasks, groceries and ideas. You review before anything is added.'
      : 'Sorted with simple rules here. You review before anything is added.';
  }

  function taskRow(t, opts = {}) {
    const done = t.status === 'done';
    const metaBits = [];
    if (t.time) metaBits.push(esc(t.time));
    if (opts.showDate && t.date) metaBits.push(esc(dayLabel(t.date)));
    if (t.status === 'doing') metaBits.push('in progress');
    const badges = [];
    const from = t.date && t.date < today() ? t.date : (t.originalDate && t.date && t.originalDate < t.date ? t.originalDate : null);
    if (from && !done) badges.push(`<span class="badge">from ${esc(dayLabel(from))}</span>`);
    if (t.projectId && opts.showProject !== false && S.projects[t.projectId]) badges.push(`<span class="badge proj">${esc(projName(t.projectId))}</span>`);
    const acts = [];
    if (!done && opts.today) acts.push(`<button class="mini" data-act="to-today" data-id="${esc(t.id)}">Today</button>`);
    if (!done && opts.tomorrow !== false) acts.push(`<button class="mini" data-act="to-tomorrow" data-id="${esc(t.id)}" aria-label="Move to tomorrow">Tmrw</button>`);
    if (!done && opts.drop) acts.push(`<button class="mini ghost" data-act="drop" data-id="${esc(t.id)}" aria-label="Drop task">✕</button>`);
    return `<div class="task-item ${done ? 'done' : ''}" style="border-left-color:${catColor(t.category)}">
      <input type="checkbox" data-act="toggle" data-id="${esc(t.id)}" ${done ? 'checked' : ''} aria-label="Done">
      <span class="text"><span class="t">${badges.join('')}${esc(t.title)}</span>${metaBits.length ? `<span class="meta">${metaBits.join(' · ')}</span>` : ''}</span>
      ${acts.join('')}
    </div>`;
  }

  function renderWaiting() {
    const waiting = Object.values(S.dumps).filter(d => !d.processed && (!review || review.dumpId !== d.id)).sort((a, b) => a.createdAt - b.createdAt);
    $('waitingBox').innerHTML = waiting.length ? `<div class="card"><h2>📝 Saved brain dumps to sort (${waiting.length})</h2>
      ${waiting.map(d => `<div class="note-item"><span>${esc(d.text.length > 140 ? d.text.slice(0, 140) + '…' : d.text)}</span>
        <button class="mini primary" data-act="dump-retry" data-id="${esc(d.id)}">Sort</button>
        <button class="mini ghost" data-act="dump-dismiss" data-id="${esc(d.id)}" aria-label="Dismiss">${confirmKey === 'dd-' + d.id ? 'Sure?' : '✕'}</button></div>`).join('')}
    </div>` : '';
  }

  function renderCarry() {
    const { carry } = views();
    if (!carry.length) { $('carryBox').innerHTML = ''; return; }
    $('carryBox').innerHTML = `<div class="card carry"><h2><span>↪ Carried over (${carry.length})</span>
      <span style="display:flex;gap:6px"><button class="mini" data-act="carry-all-today">All to today</button><button class="mini" data-act="carry-drop-all">${confirmKey === 'carry-drop' ? 'Tap again' : 'Drop all'}</button></span></h2>
      ${carry.map(t => taskRow(t, { today: true, drop: true })).join('')}
      <p class="muted" style="margin-top:4px">Nothing here disappears until you check it, move it, or drop it.</p></div>`;
  }

  function buildPrompt(text) {
    const td = today();
    const projects = Object.values(S.projects).map(p => `${p.id}: ${p.name}`).join('\n') || '(none)';
    const open = Object.values(S.tasks).filter(isOpen).slice(0, 120).map(t => `${t.id}: ${t.title}`).join('\n') || '(none)';
    return `You organize a busy mom's brain dump into structured items for her personal dashboard.
Today is ${parseYmd(td).toLocaleDateString('en-US', { weekday: 'long' })} ${td}.
Household: Farah (mom), Omar (husband), sons Hamad (4.5), Talal (3), Yousef (6 months).
Categories: kids, work, home, errands, self, activity, omar.
Grocery stores: ${stores().join(', ')}.
Existing projects (id: name):
${projects}
Tasks already open on her list (id: title):
${open}

Brain dump:
"""
${text}
"""

Return ONLY a JSON object, no other text:
{"tasks":[{"title":string,"category":string,"projectId":string|null,"newProject":string|null,"date":"YYYY-MM-DD"|null,"time":"h:mm AM"|null,"duplicateOf":string|null}],
 "grocery":[{"item":string,"store":string}],
 "ideas":[{"text":string,"projectId":string|null}]}

Rules:
- Split into separate items. Keep her wording; short titles, starting with a verb where natural.
- Food and household consumables to buy (yogurt, diapers, wipes, chicken) go in "grocery". Use the store she named; otherwise the most likely of the listed stores; otherwise "Other". A bare store name like "Costco" with nothing else is an errands task.
- Non-grocery purchases (shoes, gifts) are errands tasks.
- Link to an existing project by id when the item clearly belongs to it. Use "newProject" only for a clearly new ongoing body of work.
- Dates: set only when stated or clearly implied. If the dump is labelled for a day ("brain dump Thursday") or says today, use that date for its tasks. Resolve "tomorrow" and weekday names to the next such date. Otherwise null.
- Time only when she states one. Never invent details.
- "duplicateOf": the id of an open task that means the same thing, else null.
- Ideas are things to remember that aren't actions yet.`;
  }

  const GROCERY_WORDS = /\b(yogh?urt|milk|eggs?|bread|berr(y|ies)|blueberr|strawberr|chicken|beef|turkey|fish|rice|cheese|fruit|apples?|bananas?|grapes|water|oil|diapers?|wipes|formula|puffs|pasta|tomato|onions?|garlic|potato|cucumber|lettuce|spinach|butter|labneh|hummus|zaatar|za'atar|olive|dates|flour|sugar|cereal|oats|snacks?|juice|coffee|tea|paper towels?|toilet paper|detergent|soap|shampoo)\b/i;
  const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  function guessCategory(s) {
    if (/\bomar\b/i.test(s)) return 'omar';
    if (/hamad|talal|yousef|yusuf|\bkids?\b|school|daycare|pediatric|diaper|nap|\brms\b|\bot\b|soccer|nanny/i.test(s)) return 'kids';
    if (/workwave|\bwork\b|email|portfolio|course|meeting|interview|onboard|resume/i.test(s)) return 'work';
    if (/shower|workout|gym|\bread\b|rest\b|sleep|walk|pray|nails|hair/i.test(s)) return 'self';
    if (/park|library|museum|outing|picking|play ?date|class\b|zoo/i.test(s)) return 'activity';
    if (/\bcall\b|walgreens|pharmacy|pick ?up|drop ?off|\border\b|\bbuy\b|return|post office|bank|appointment|costco|target|walmart|aldi|amazon/i.test(s)) return 'errands';
    return 'home';
  }
  function guessDate(s, dumpDate) {
    const l = s.toLowerCase(); const td = today();
    if (/\btomorrow\b/.test(l)) return addDays(td, 1);
    if (/\btoday\b|\btonight\b|this morning/.test(l)) return td;
    for (let i = 0; i < 7; i++) {
      if (new RegExp('\\b' + WEEKDAYS[i] + '\\b').test(l)) { const cur = new Date().getDay(); const diff = (i - cur + 7) % 7; return addDays(td, diff); }
    }
    return dumpDate;
  }
  function localParse(text) {
    let s = String(text);
    let dumpDate = null;
    const head = s.match(/^\s*brain\s*dump\s*([a-z]*)\s*:/i);
    if (head) { dumpDate = guessDate(head[1] || '', null) || today(); s = s.slice(head[0].length); }
    const parts = s.split(/\n|,|;|•|\.\s+/).map(x => x.trim().replace(/^[-*\d.)\s]+/, '').replace(/\.$/, '')).filter(x => x.length > 1);
    const storeList = stores();
    const out = { tasks: [], grocery: [], ideas: [] };
    parts.forEach(p => {
      const storeHit = storeList.find(st => p.toLowerCase().includes(st.toLowerCase()));
      const bare = storeHit && norm(p) === norm(storeHit);
      if (!bare && (GROCERY_WORDS.test(p) && !/\b(call|order shoes|clean|fold)\b/i.test(p))) {
        const item = p.replace(/^(buy|get|grab|need|pick up|order)\s+/i, '').replace(new RegExp('\\s*(at|from|to|@)?\\s*' + (storeHit || '\\b\\B') + '\\b', 'i'), '').trim();
        item.split(/\s+and\s+/i).forEach(it => { if (it) out.grocery.push({ item: it, store: storeHit || 'Other' }); });
        return;
      }
      if (/^(idea|maybe|someday|remember)\b[:\s]/i.test(p)) { out.ideas.push({ text: p.replace(/^(idea|maybe|someday|remember)\b[:\s]*/i, ''), projectId: null }); return; }
      const proj = Object.values(S.projects).find(pr => {
        const words = norm(pr.name).split(' ').filter(w => w.length > 3 && !['game', 'project', 'with', 'outing'].includes(w));
        return words.some(w => norm(p).includes(w));
      });
      out.tasks.push({ title: bare ? `${storeHit} run` : p.charAt(0).toUpperCase() + p.slice(1), category: proj ? (proj.category || guessCategory(p)) : guessCategory(p),
        projectId: proj ? proj.id : null, newProject: null, date: guessDate(p, dumpDate), time: null, duplicateOf: null });
    });
    return out;
  }
  function normalizeReview(raw, dumpId, how) {
    const storeList = stores();
    const openByNorm = new Map(Object.values(S.tasks).filter(isOpen).map(t => [norm(t.title), t]));
    const dateOk = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null;
    const tasks = (Array.isArray(raw.tasks) ? raw.tasks : []).filter(t => t && t.title).map(t => {
      const dup = (t.duplicateOf && S.tasks[t.duplicateOf] && isOpen(S.tasks[t.duplicateOf])) ? S.tasks[t.duplicateOf] : openByNorm.get(norm(t.title));
      return { title: String(t.title).trim(), category: CATS[t.category] ? t.category : guessCategory(t.title),
        projectId: t.projectId && S.projects[t.projectId] ? t.projectId : null,
        newProject: !t.projectId && t.newProject ? String(t.newProject).trim() : null,
        date: dateOk(t.date), time: t.time ? String(t.time) : null, dupOf: dup ? dup.title : null, include: !dup };
    });
    const grocery = (Array.isArray(raw.grocery) ? raw.grocery : []).filter(g => g && g.item).map(g => {
      const store = storeList.find(s => s.toLowerCase() === String(g.store || '').toLowerCase()) || 'Other';
      const dup = Object.values(S.grocery).some(x => !x.archived && !x.checked && x.store === store && norm(x.item) === norm(g.item));
      return { item: String(g.item).trim(), store, dup, include: !dup };
    });
    const ideas = (Array.isArray(raw.ideas) ? raw.ideas : []).filter(i => i && i.text).map(i => ({
      text: String(i.text).trim(), projectId: i.projectId && S.projects[i.projectId] ? i.projectId : null, include: true }));
    return { dumpId, how, tasks, grocery, ideas, loading: false };
  }
  async function sortDump(dump) {
    review = { dumpId: dump.id, loading: true }; render();
    let raw = null, how = 'rules';
    if (sample) {
      try { raw = await sample.json(buildPrompt(dump.text), { modelTier: 'quick' }); how = 'claude'; }
      catch (e) { if (e && e.code === 'not_granted') { sample = null; } raw = null; }
    }
    if (!raw || typeof raw !== 'object') { raw = localParse(dump.text); how = 'rules'; }
    if (!review || review.dumpId !== dump.id) return;

  }
  function commitReview() {
    if (!review || review.loading) return;
    const madeProjects = {};
    review.tasks.filter(t => t.include && t.title).forEach(t => {
      let pid = t.projectId;
      if (!pid && t.newProject) {
        const key = norm(t.newProject);
        const existing = Object.values(S.projects).find(p => norm(p.name) === key);
        if (existing) pid = existing.id;
        else if (madeProjects[key]) pid = madeProjects[key];
        else { const p = { id: newId('p'), name: t.newProject, category: t.category, status: 'active', notes: '', createdAt: Date.now() }; stage('projects', p); pid = madeProjects[key] = p.id; }
      }
      stage('tasks', makeTask({ title: t.title, category: t.category, projectId: pid, date: t.date, time: t.time, source: 'brain-dump' }));
    });
    review.grocery.filter(g => g.include && g.item).forEach(g => {
      stage('grocery', { id: newId('g'), item: g.item, store: g.store, checked: false, archived: false, quantity: null, notes: '', createdAt: Date.now() });
    });
    review.ideas.filter(i => i.include && i.text).forEach(i => {
      stage('notes', { id: newId('n'), text: i.text, projectId: i.projectId || null, createdAt: Date.now() });
    });
    const d = S.dumps[review.dumpId];
    if (d) stage('dumps', Object.assign({}, d, { processed: true, processedAt: Date.now() }));
    review = null;
    commit();
  }

      const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
      return `<button class="accordion-header ${isOpenAcc ? 'active' : ''}" data-act="acc" data-key="p-${esc(p.id)}" aria-expanded="${isOpenAcc}">
          <span>${esc(p.name)}</span><span class="right">${tasks.length ? `${done}/${tasks.length}<span class="progress"><i style="width:${pct}%"></i></span>` : ''}<span>${isOpenAcc ? '▲' : '▼'}</span></span></button>
        ${isOpenAcc ? `<div class="accordion-content">
          ${open.map(t => taskRow(t, { showProject: false, showDate: true, today: t.date !== today(), tomorrow: false })).join('')}
          ${closed.map(t => taskRow(t, { showProject: false })).join('')}
          ${!tasks.length ? '<div class="empty">No steps yet.</div>' : ''}
          ${notes.map(n => `<div class="note-item"><span>💡 ${esc(n.text)}</span><button class="mini ghost" data-act="note-del" data-id="${esc(n.id)}" aria-label="Remove idea">${confirmKey === 'nd-' + n.id ? 'Sure?' : '✕'}</button></div>`).join('')}
          <div class="add-row"><input type="text" id="pa-${esc(p.id)}" data-enter="proj-add" data-id="${esc(p.id)}" placeholder="Add a step…"></div>
        </div>` : ''}`;
    }).join('');
  }
  function renderIdeas() {
    const notes = Object.values(S.notes).filter(n => !n.projectId).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    $('ideasList').innerHTML = notes.length ? notes.map(n => `<div class="note-item"><span>${esc(n.text)}</span>
      <button class="mini" data-act="note-task" data-id="${esc(n.id)}">Make task</button>
      <button class="mini ghost" data-act="note-del" data-id="${esc(n.id)}" aria-label="Remove idea">${confirmKey === 'nd-' + n.id ? 'Sure?' : '✕'}</button></div>`).join('')
      : '<div class="empty">Ideas from your brain dump land here without becoming tasks.</div>';
  }

  // ---------- grocery ----------
  function renderGrocery() {
    const list = stores();
    const gs = $('gStore');
    if (document.activeElement !== gs) {
      const cur = gs.value || ui.store || 'Other';
      gs.innerHTML = list.map(s => `<option ${s === cur ? 'selected' : ''}>${esc(s)}</option>`).join('');
    }
    const items = Object.values(S.grocery).filter(g => !g.archived);
    $('groceryList').innerHTML = list.map((s, si) => {
      const mine = items.filter(g => g.store === s);
      const open = mine.filter(g => !g.checked).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const checked = mine.filter(g => g.checked);
      const accOpen = ui.open['g-' + s] ?? open.length > 0;
      return `<button class="accordion-header ${accOpen ? 'active' : ''}" data-act="acc" data-key="g-${esc(s)}" aria-expanded="${accOpen}">
          <span>${STORE_ICON[s] || '🏪'} ${esc(s)}</span><span class="right">${open.length ? open.length + ' to get' : ''}<span>${accOpen ? '▲' : '▼'}</span></span></button>
        ${accOpen ? `<div class="accordion-content">
          ${open.map(g => grocRow(g)).join('')}${checked.map(g => grocRow(g)).join('')}
          ${!mine.length ? '<div class="empty">Nothing on this list.</div>' : ''}
          <div class="add-row"><input type="text" id="ga-${si}" data-enter="groc-add" data-si="${si}" placeholder="Add to ${esc(s)}…"></div>
          ${checked.length ? `<button class="toggle-line" data-act="groc-clear" data-si="${si}">${confirmKey === 'gc-' + si ? 'Tap again to clear' : `Clear ${checked.length} checked`}</button>` : ''}
        </div>` : ''}`;
    }).join('');
  }
  const grocRow = g => `<div class="task-item ${g.checked ? 'done' : ''}" style="border-left-color:var(--errands)">
      <input type="checkbox" data-act="groc-toggle" data-id="${esc(g.id)}" ${g.checked ? 'checked' : ''} aria-label="Got it">
      <span class="text"><span class="t">${esc(g.item)}</span></span>
      <button class="mini ghost" data-act="groc-del" data-id="${esc(g.id)}" aria-label="Remove">✕</button></div>`;
  function addGrocery(text, fallbackStore) {
    const list = stores();
    let s = String(text || '').trim(); if (!s) return 0;
    let store = null;
    for (const st of list) {
      const re = new RegExp(`\\s*(?:\\bto\\b|\\bat\\b|\\bfrom\\b|@)?\\s*${st.replace(/[.*+?^${}()|[\]\\']/g, '\\$&')}\\s*:?`, 'i');
      if (re.test(s)) { store = st; s = s.replace(re, ' ').trim(); break; }
    }
    store = store || fallbackStore || 'Other';
    s = s.replace(/^(add|buy|get|need)\s+/i, '');
    const parts = s.split(/,|\s+and\s+|\n/).map(x => x.trim()).filter(Boolean);
    let n = 0;
    parts.forEach(item => {
      const dup = Object.values(S.grocery).some(x => !x.archived && !x.checked && x.store === store && norm(x.item) === norm(item));
      if (dup) return;
      stage('grocery', { id: newId('g'), item, store, checked: false, archived: false, quantity: null, notes: '', createdAt: Date.now() });
      n++;
    });
    ui.open['g-' + store] = true; saveUi();
    commit();
    return n;
  }

  // ---------- events ----------
  function armConfirm(key) {
    confirmKey = key; clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => { confirmKey = null; render(); }, 3500);
    render();
  }
  function wireEvents() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el) return;
      const act = el.dataset.act, id = el.dataset.id;
      switch (act) {
        case 'tab': ui.tab = el.dataset.tab; saveUi(); render(); window.scrollTo({ top: 0 }); break;
        case 'sub': ui.sub = el.dataset.sub; saveUi(); render(); break;
        case 'toggle': { const t = S.tasks[id]; if (t) setTask(id, { status: t.status === 'done' ? 'todo' : 'done' }); break; }
        case 'status': setTask(id, { status: el.dataset.to }); break;
        case 'to-today': moveTo(id, today()); break;
        case 'to-tomorrow': moveTo(id, addDays(today(), 1)); break;
        case 'drop': setTask(id, { status: 'dropped', droppedAt: Date.now() }); break;
        case 'carry-all-today': { const td = today(); views().carry.forEach(t => stage('tasks', Object.assign({}, t, { date: td, originalDate: t.originalDate || t.date }))); commit(); break; }
        case 'carry-drop-all': {
          if (confirmKey !== 'carry-drop') { armConfirm('carry-drop'); return; }
          confirmKey = null; views().carry.forEach(t => stage('tasks', Object.assign({}, t, { status: 'dropped', droppedAt: Date.now() }))); commit(); break;
        }
        case 'toggle-done': ui.showDone = !ui.showDone; saveUi(); render(); break;
        case 'organize': {
          const ta = $('dumpText'); const text = ta.value.trim(); if (!text) { ta.focus(); return; }
          const dump = { id: newId('d'), text, createdAt: Date.now(), processed: false };
          put('dumps', dump); ta.value = ''; lsSet(LS.draft, '');
          sortDump(dump); break;
        }
        case 'dump-retry': { const d = S.dumps[id]; if (d) sortDump(d); break; }
        case 'dump-dismiss': {
          if (confirmKey !== 'dd-' + id) { armConfirm('dd-' + id); return; }
          confirmKey = null; const d = S.dumps[id]; if (d) put('dumps', Object.assign({}, d, { processed: true, dismissed: true, processedAt: Date.now() })); break;
        }
        case 'rv-inc': { const arr = review && review[el.dataset.kind]; if (arr) { arr[+el.dataset.i].include = el.checked; render(); } break; }
        case 'rv-commit': commitReview(); break;
        case 'rv-cancel': review = null; render(); break;
        case 'kt-del': { const kt = (meta().keyTimes || []).slice(); kt.splice(+el.dataset.i, 1); setMeta({ keyTimes: kt }); break; }
        case 'dress-edit': {
          if (editDress) {
            const big = ($('dcBig') || {}).value || ''; const baby = ($('dcBaby') || {}).value || '';
            editDress = false; setMeta({ dress: { big: big.trim(), baby: baby.trim() } });
          } else { editDress = true; render(); }
          break;
        }
        case 'add-task': addTaskFromForm(); break;
        case 'add-project': addProject(); break;
        case 'acc': ui.open[el.dataset.key] = !(el.classList.contains('active')); saveUi(); render(); break;
        case 'note-del': { if (confirmKey !== 'nd-' + id) { armConfirm('nd-' + id); return; } confirmKey = null; unstage('notes', id); commit(); break; }
        case 'note-task': { const n = S.notes[id]; if (!n) return; stage('tasks', makeTask({ title: n.text, category: guessCategory(n.text), source: 'idea' })); unstage('notes', id); commit(); break; }
        case 'groc-toggle': { const g = S.grocery[id]; if (g) put('grocery', Object.assign({}, g, { checked: !g.checked, checkedAt: !g.checked ? Date.now() : null })); break; }
        case 'groc-del': { const g = S.grocery[id]; if (g) put('grocery', Object.assign({}, g, { archived: true, archivedAt: Date.now() })); break; }
        case 'groc-clear': {
          const si = el.dataset.si; if (confirmKey !== 'gc-' + si) { armConfirm('gc-' + si); return; }
          confirmKey = null; const s = stores()[+si];
          Object.values(S.grocery).filter(g => !g.archived && g.checked && g.store === s).forEach(g => stage('grocery', Object.assign({}, g, { archived: true, archivedAt: Date.now() })));
          commit(); break;
        }
        case 'groc-quick': quickGrocery(); break;
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      const el = e.target; const act = el.dataset && el.dataset.enter; if (!act) return;
      e.preventDefault();
      const v = el.value.trim();
      switch (act) {
        case 'add-task': addTaskFromForm(); break;
        case 'add-project': addProject(); break;
        case 'kt-add': if (v) { setMeta({ keyTimes: [...(meta().keyTimes || []), v] }); el.value = ''; } break;
        case 'add-idea': if (v) { el.value = ''; put('notes', { id: newId('n'), text: v, projectId: null, createdAt: Date.now() }); } break;
        case 'proj-add': if (v) { const p = S.projects[el.dataset.id]; el.value = ''; put('tasks', makeTask({ title: v, category: (p && p.category) || 'self', projectId: el.dataset.id })); } break;
        case 'groc-add': if (v) { el.value = ''; addGrocery(v, stores()[+el.dataset.si]); } break;
        case 'groc-quick': quickGrocery(); break;
        case 'add-store': if (v && !stores().includes(v)) { el.value = ''; ui.open['g-' + v] = true; saveUi(); setMeta({ stores: [...stores(), v] }); } break;
      }
    });
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.id === 'dumpText') { lsSet(LS.draft, el.value); return; }
      if (el.dataset && el.dataset.rv && review && review[el.dataset.kind] && el.tagName === 'INPUT') {
        review[el.dataset.kind][+el.dataset.i][el.dataset.rv] = el.value;
      }
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'gStore') { ui.store = el.value; saveUi(); return; }
      if (el.dataset && el.dataset.rv && review && review[el.dataset.kind] && el.tagName === 'SELECT') {
        const it = review[el.dataset.kind][+el.dataset.i]; const f = el.dataset.rv;
        if (f === 'projectId') { if (el.value !== '__new') { it.projectId = el.value || null; it.newProject = null; } }
        else it[f] = el.value || null;
        render();
      }
    });
  }
  function addTaskFromForm() {
    const title = $('ntTitle').value.trim(); if (!title) { $('ntTitle').focus(); return; }
    const dv = $('ntDate').value;
    const date = dv === 'today' ? today() : dv === 'tomorrow' ? addDays(today(), 1) : null;
    $('ntTitle').value = ''; const time = fmt24($('ntTime').value); $('ntTime').value = '';
    put('tasks', makeTask({ title, category: $('ntCat').value, date, time }));
  }
  function addProject() {
    const name = $('npName').value.trim(); if (!name) return;
    if (Object.values(S.projects).some(p => norm(p.name) === norm(name))) { $('npName').value = ''; return; }
    const p = { id: newId('p'), name, category: 'self', status: 'active', notes: '', createdAt: Date.now() };
    $('npName').value = ''; ui.open['p-' + p.id] = true; saveUi(); put('projects', p);
  }
  function quickGrocery() {
    const el = $('gQuick'); const v = el.value.trim(); if (!v) return;
    el.value = ''; addGrocery(v, $('gStore').value);
  }

  init();
})();
</script>
</body>
</html>
