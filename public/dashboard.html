          ${!tasks.length ? '<div class="empty">No steps yet.</div>' : ''}
          ${notes.map(n => `<div class="note-item"><span>💡 ${esc(n.text)}</span><button class="mini ghost" data-act="note-del" data-id="${esc(n.id)}" aria-label="Remove idea">${confirmKey === 'nd-' + n.id ? 'Sure?' : '✕'}</button></div>`).join('')}
          <div class="add-row"><input type="text" id="pa-${esc(p.id)}" data-enter="proj-add" data-id="${esc(p.id)}" placeholder="Add a step…"></div>
        </div>` : ''}`;
    }).join('');
  }
  function renderIdeas() {
    const notes = Object.values(S.notes).filter(n => !n.projectId).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    $('ideasList').innerHTML = notes.length ? notes.map(n => `<div class="note-item"><span>${esc(n.text)}</span>
      <button class="mini" data-act="note-task" data-id="${esc(n.id)}">Make task</button>
      <button class="mini ghost" data-act="note-del" data-id="${esc(n.id)}" aria-label="Remove idea">${confirmKey === 'nd-' + n.id ? 'Sure?' : '✕'}</button></div>`).join('')
      : '<div class="empty">Ideas from your brain dump land here without becoming tasks.</div>';
  }

  // ---------- grocery ----------
  function renderGrocery() {
    const list = stores();
    const gs = $('gStore');
    if (document.activeElement !== gs) {
      const cur = gs.value || ui.store || 'Other';
      gs.innerHTML = list.map(s => `<option ${s === cur ? 'selected' : ''}>${esc(s)}</option>`).join('');
    }
    const items = Object.values(S.grocery).filter(g => !g.archived);
    $('groceryList').innerHTML = list.map((s, si) => {
      const mine = items.filter(g => g.store === s);
      const open = mine.filter(g => !g.checked).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const checked = mine.filter(g => g.checked);
      const accOpen = ui.open['g-' + s] ?? open.length > 0;
      return `<button class="accordion-header ${accOpen ? 'active' : ''}" data-act="acc" data-key="g-${esc(s)}" aria-expanded="${accOpen}">
          <span>${STORE_ICON[s] || '🏪'} ${esc(s)}</span><span class="right">${open.length ? open.length + ' to get' : ''}<span>${accOpen ? '▲' : '▼'}</span></span></button>
        ${accOpen ? `<div class="accordion-content">
          ${open.map(g => grocRow(g)).join('')}${checked.map(g => grocRow(g)).join('')}
          ${!mine.length ? '<div class="empty">Nothing on this list.</div>' : ''}
          <div class="add-row"><input type="text" id="ga-${si}" data-enter="groc-add" data-si="${si}" placeholder="Add to ${esc(s)}…"></div>
          ${checked.length ? `<button class="toggle-line" data-act="groc-clear" data-si="${si}">${confirmKey === 'gc-' + si ? 'Tap again to clear' : `Clear ${checked.length} checked`}</button>` : ''}
        </div>` : ''}`;
    }).join('');
  }
  const grocRow = g => `<div class="task-item ${g.checked ? 'done' : ''}" style="border-left-color:var(--errands)">
      <input type="checkbox" data-act="groc-toggle" data-id="${esc(g.id)}" ${g.checked ? 'checked' : ''} aria-label="Got it">
      <span class="text"><span class="t">${esc(g.item)}</span></span>
      <button class="mini ghost" data-act="groc-del" data-id="${esc(g.id)}" aria-label="Remove">✕</button></div>`;
  function addGrocery(text, fallbackStore) {
    const list = stores();
    let s = String(text || '').trim(); if (!s) return 0;
    let store = null;
    for (const st of list) {
      const re = new RegExp(`\\s*(?:\\bto\\b|\\bat\\b|\\bfrom\\b|@)?\\s*${st.replace(/[.*+?^${}()|[\]\\']/g, '\\$&')}\\s*:?`, 'i');
      if (re.test(s)) { store = st; s = s.replace(re, ' ').trim(); break; }
    }
    store = store || fallbackStore || 'Other';
    s = s.replace(/^(add|buy|get|need)\s+/i, '');
    const parts = s.split(/,|\s+and\s+|\n/).map(x => x.trim()).filter(Boolean);
    let n = 0;
    parts.forEach(item => {
      const dup = Object.values(S.grocery).some(x => !x.archived && !x.checked && x.store === store && norm(x.item) === norm(item));
      if (dup) return;
      stage('grocery', { id: newId('g'), item, store, checked: false, archived: false, quantity: null, notes: '', createdAt: Date.now() });
      n++;
    });
    ui.open['g-' + store] = true; saveUi();
    commit();
    return n;
  }

  // ---------- events ----------
  function armConfirm(key) {
    confirmKey = key; clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => { confirmKey = null; render(); }, 3500);
    render();
  }
  // ---------- smart time tracker + smart suggestions ----------
  // Reads only the existing state (S.tasks, meta().keyTimes, live.cal) and writes only through setTask().
  // The timer lives on the task itself (task.timer = { startedAt, elapsedMs }), so it syncs like any other edit
  // and there is no second task system. Starting sets status 'doing' (shows in Kanban "In Progress");
  // Complete sets status 'done' on the same task.
  //
  // Later signals (weather, Gmail, location, notifications) plug into smartContext() as new fields,
  // and into SMART_RULES as new rules. Nothing else needs to change.
  const SMART_LS = 'fmd4-smart-dismissed';
  const DAY_END_MIN = 21 * 60;      // treat 9 PM as the end of a planning day when nothing else is scheduled
  const OPEN_WINDOW_MIN = 60;       // a sensible focus block when there is no next commitment
  const BUFFER_MIN = 5;             // transition time before the next commitment
  let stSkip = [];                  // task ids skipped with "Another option" (this session only)
  let smartDismissed = lsGet(SMART_LS, {});

  const nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const minLabel = m => { const h = Math.floor(m / 60), r = m % 60; return h ? `${h} hr${r ? ` ${r} min` : ''}` : `${m} min`; };
  const clockLabel = min => { const h = Math.floor(min / 60) % 24, m = min % 60; return `${((h + 11) % 12) + 1}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`; };
  const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);

  // Duration: the task's own value first, then a number in the title, then a light keyword estimate.
  function taskMinutes(t) {
    const d = t.duration;
    if (typeof d === 'number' && d > 0) return d;
    if (typeof d === 'string') { const n = parseInt(d, 10); if (n > 0) return /h/i.test(d) && n < 10 ? n * 60 : n; }
    const m = String(t.title).match(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minutes)\b/i);
    if (m) return /^h/i.test(m[2]) ? Math.round(parseFloat(m[1]) * 60) : Math.round(parseFloat(m[1]));
    const s = norm(t.title);
    if (/\b(call|text|email|reply|book|reserve|order|pay|sign|schedule|switch|start .*load)\b/.test(s)) return 10;
    if (/\blaundry\b|\bfold\b|\btidy\b|\bpack\b|\bsort\b/.test(s)) return 20;
    if (/\b(run|trip|shopping|costco|trader|target|walmart|aldi|errand)\b/.test(s)) return 45;
    if (/\b(cook|make|bake|dinner|lunch|kofta|maqlou?b|prep)\b/.test(s)) return 45;
    if (/\b(course|study|learn|write|design|build|develop|launch|test|plan|stories|layout|sew)\b/.test(s)) return 45;
    if (/\b(outing|stroll|park|picking|carving|museum|library)\b/.test(s)) return 45;
    if (t.projectId) return 30;
    return ({ kids: 20, work: 40, home: 20, errands: 40, self: 30, activity: 45, omar: 20 })[t.category] || 30;
  }
  const priorityScore = p => {
    if (p == null || p === '') return 0;
    const v = String(p).toLowerCase();
    if (v === '1' || v.startsWith('h') || v === 'urgent') return 30;
    if (v === '2' || v.startsWith('m')) return 15;
    return 0;
  };

  // Everything the two sections reason about, gathered in one place.
  function smartContext() {
    const td = today(), nowMin = nowMinutes(), now = Date.now();
    const all = Object.values(S.tasks).filter(capVisible);
    const commitments = [];
    all.forEach(t => {
      if (!isOpen(t) || t.date !== td || !t.time) return;
      const m = timeMin(t.time); if (m < 9000 && m > nowMin) commitments.push({ min: m, title: t.title, id: t.id, source: 'task' });
    });
    let busy = null;
    eventsOn(td).forEach(ev => {
      if (ev.allDay) return;
      const st = new Date(ev.start).getTime(), en = ev.end ? new Date(ev.end).getTime() : st;
      if (st <= now && en > now) { const e = new Date(en); busy = { title: ev.title || 'an event', until: e.getHours() * 60 + e.getMinutes() }; }
      const m = evMin(ev); if (m > nowMin) commitments.push({ min: m, title: ev.title || 'Calendar event', source: 'calendar' });
    });
    (Array.isArray(meta().keyTimes) ? meta().keyTimes : []).forEach(k => {
      const hit = String(k).match(/(\d{1,2}(?::\d{2})?\s*[ap]\.?\s*m\.?)/i); if (!hit) return;
      const m = timeMin(hit[1].replace(/\s+/g, ' ')); if (m >= 9000 || m <= nowMin) return;
      const label = String(k).replace(hit[1], '').replace(/[:\-–@]+\s*$/, '').replace(/\bat\s*$/i, '').trim();
      commitments.push({ min: m, title: label || 'Key time', source: 'keyTime' });
    });
    commitments.sort((a, b) => a.min - b.min);
    const next = commitments[0] || null;
    let minutes, open = false;
    if (busy) minutes = 0;
    else if (next) minutes = Math.max(0, next.min - nowMin - BUFFER_MIN);
    else { open = true; minutes = nowMin < DAY_END_MIN ? Math.max(OPEN_WINDOW_MIN, Math.min(180, DAY_END_MIN - nowMin)) : OPEN_WINDOW_MIN; }
    minutes = Math.round(minutes / 5) * 5;
    const active = all.filter(t => t.status === 'doing' && t.timer && (t.timer.startedAt || t.timer.elapsedMs))
      .sort((a, b) => (b.timer.startedAt || b.updatedAt || 0) - (a.timer.startedAt || a.updatedAt || 0))[0] || null;
    const candidates = rankCandidates(all, td, nowMin, minutes);
    const fit = candidates.filter(x => x.fits && !stSkip.includes(x.t.id))[0];
    return {
      td, now, nowMin, all, busy, next, minutes, open, active, candidates,
      pick: !active && !busy && fit ? fit.t : null,   // what the tracker is currently recommending
      calendar: live.cal            // future: weather (live.weather), mail (live.mail), location, notifications
    };
  }

  // Tasks it makes sense to work on now, best first. Future timed tasks are commitments, not candidates;
  // timed kids routines (naps, meals) that already passed aren't offered as work.
  function rankCandidates(all, td, nowMin, minutes) {
    return all.filter(t => {
      if (!isOpen(t)) return false;
      if (t.date && t.date > td) return false;
      if (t.time && t.date === td) { const m = timeMin(t.time); if (m < 9000 && m > nowMin) return false; if (t.category === 'kids') return false; }
      if (t.time && t.date && t.date < td && t.category === 'kids') return false;
      return true;
    }).map(t => {
      const mins = taskMinutes(t);
      let score = priorityScore(t.priority);
      if (t.status === 'doing') score += 25;
      if (t.date && t.date < td) score += 20 + Math.min(10, daysBetween(t.date, td) * 2);
      else if (t.date === td) score += 15;
      else if (!t.projectId) score += 5;
      if (t.originalDate && t.originalDate < td) score += Math.min(12, 4 + daysBetween(t.originalDate, td) * 2);
      const fits = mins <= minutes && mins <= CAP[capMode()].maxTask;
      if (fits && minutes > 0) score += Math.round((mins / minutes) * 12);
      return { t, mins, fits, score };
    }).sort((a, b) => (b.fits - a.fits) || (b.score - a.score) || (a.mins - b.mins));
  }

  // ----- timer actions (all through setTask) -----
  const elapsedMs = t => !t || !t.timer ? 0 : (t.timer.elapsedMs || 0) + (t.timer.startedAt ? Date.now() - t.timer.startedAt : 0);
  function pauseTimerStaged(t) {
    if (!t || !t.timer || !t.timer.startedAt) return;
    stage('tasks', Object.assign({}, t, { timer: { startedAt: null, elapsedMs: elapsedMs(t) } }));
  }
  function startTimer(id) {
    const t = S.tasks[id]; if (!t || !isOpen(t)) return;
    Object.values(S.tasks).forEach(o => { if (o.id !== id && o.timer && o.timer.startedAt) pauseTimerStaged(o); });
    stSkip = [];
    setTask(id, { status: 'doing', timer: { startedAt: Date.now(), elapsedMs: (t.timer && t.timer.elapsedMs) || 0 } });
  }
  function pauseTimer(id) { const t = S.tasks[id]; if (t) setTask(id, { timer: { startedAt: null, elapsedMs: elapsedMs(t) } }); }
  function completeTimer(id) {
    const t = S.tasks[id]; if (!t) return;
    const spent = Math.round(elapsedMs(t) / 60000);
    setTask(id, { status: 'done', timer: null, spentMin: (t.spentMin || 0) + spent });
  }
  function setAside(id) {
    const t = S.tasks[id]; if (!t) return;
    setTask(id, { status: 'todo', timer: null, spentMin: (t.spentMin || 0) + Math.round(elapsedMs(t) / 60000) });
  }
  const fmtElapsed = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; };
  const metaLine = (t, mins) => [`~${mins} min`, (CATS[t.category] || {}).label, t.projectId ? projName(t.projectId) : '',
    t.date && t.date < today() ? `from ${dayLabel(t.date)}` : ''].filter(Boolean).map(esc).join(' · ');

  function renderTracker() {
    const box = $('trackerBox'); if (!box) return;
    const c = smartContext();
    let body;
    if (c.active) {
      const t = c.active, mins = taskMinutes(t), run = !!t.timer.startedAt, ms = elapsedMs(t);
      const pct = Math.min(100, Math.round(ms / 60000 / mins * 100));
      body = `<div class="st-pick" style="border-left-color:${catColor(t.category)}">
          <div class="st-label">${run ? 'Working on' : 'Paused'}</div>
          <div class="st-title">${esc(t.title)}</div>
          <div class="st-clock ${run ? '' : 'paused'}" id="stClock" aria-live="off">${fmtElapsed(ms)}</div>
          <div class="st-meta" id="stPlan">${esc(`~${mins} min planned`)}${c.next ? ` · ${esc(c.next.title)} at ${esc(clockLabel(c.next.min))}` : ''}</div>
          <div class="st-bar"><i id="stBar" class="${ms / 60000 > mins ? 'over' : ''}" style="width:${pct}%"></i></div>
          <div class="st-acts">
            ${run ? `<button class="btn-secondary" data-act="st-pause" data-id="${esc(t.id)}">Pause</button>`
                  : `<button class="btn-secondary" data-act="st-resume" data-id="${esc(t.id)}">Resume</button>`}
            <button class="btn-add" data-act="st-complete" data-id="${esc(t.id)}">Complete</button>
            <button class="mini ghost" data-act="st-aside" data-id="${esc(t.id)}">Set aside</button>
          </div></div>`;
    } else if (c.busy) {
      body = `<div class="empty">You're in ${esc(c.busy.title)} until ${esc(clockLabel(c.busy.until))}. A pick shows up here when you're free.</div>`;
    } else if (!c.candidates.length) {
      body = `<div class="empty">Your list is clear. Tasks you add in Brain dump or Schedule show up here.</div>`;
    } else if (c.minutes < 10 && c.next) {
      body = `<div class="st-window">${esc(c.next.title)} is at ${esc(clockLabel(c.next.min))}. Not enough time to start something new.</div>`;
    } else {
      const fitting = c.candidates.filter(x => x.fits && !stSkip.includes(x.t.id));
      const windowLine = c.open ? `Nothing else is scheduled. Plan on about ${minLabel(c.minutes)}.`
        : `You have about ${minLabel(c.minutes)} before ${esc(c.next.title)} at ${esc(clockLabel(c.next.min))}.`;
      if (fitting.length) {
        const { t, mins } = fitting[0];
        const more = c.candidates.filter(x => x.fits).length > 1;
        body = `<div class="st-window">${windowLine}</div>
          <div class="st-pick" style="border-left-color:${catColor(t.category)}">
            <div class="st-label">Good use of this time</div>
            <div class="st-title">${esc(t.title)}</div>
            <div class="st-meta">${metaLine(t, mins)}</div>
            <div class="st-acts">
              <button class="btn-add" data-act="st-start" data-id="${esc(t.id)}">Start timer</button>
              ${more ? `<button class="mini ghost" data-act="st-skip" data-id="${esc(t.id)}">Another option</button>` : ''}
            </div></div>`;
      } else if (stSkip.length && c.candidates.some(x => x.fits)) {
        stSkip = []; return renderTracker();
      } else {
        const shortest = c.candidates.slice().sort((a, b) => a.mins - b.mins)[0];
        body = `<div class="st-window">${windowLine}</div>
          <div class="st-pick" style="border-left-color:${catColor(shortest.t.category)}">
            <div class="st-label">Nothing on your list fits this window. Quickest option</div>
            <div class="st-title">${esc(shortest.t.title)}</div>
            <div class="st-meta">${metaLine(shortest.t, shortest.mins)}</div>
            <div class="st-acts"><button class="btn-secondary" data-act="st-start" data-id="${esc(shortest.t.id)}">Start anyway</button></div></div>`;
      }
    }
    box.innerHTML = `<div class="card"><h2>⏳ Smart Time Tracker</h2>${body}</div>`;
  }

  // ----- suggestions: each rule looks at the context and returns one suggestion or nothing -----
  // A suggestion never changes a task by itself; only its buttons do, when tapped.
  const SMART_RULES = [
    // A short window: steer toward something quick.
    c => {
      if (c.active || c.busy || c.open || !c.next || c.minutes < 5 || c.minutes > 20) return null;
      const isQuick = x => x.mins <= Math.max(10, c.minutes);
      if (c.pick && c.candidates.some(x => x.t === c.pick && isQuick(x)) && !c.candidates.some(x => x.t !== c.pick && isQuick(x))) return null;
      const quick = c.candidates.find(x => x.t !== c.pick && isQuick(x));
      const until = `${esc(c.next.title)} at ${esc(clockLabel(c.next.min))}`;
      return quick
        ? { key: 'short:' + quick.t.id, w: 90, task: quick.t, text: `You only have about ${c.minutes} minutes before ${until}. ${esc(quick.t.title)} (~${quick.mins} min) fits better than starting something that needs a longer focus block.` }
        : { key: 'short-none', w: 85, text: `You only have about ${c.minutes} minutes before ${until}. A good moment to reset or get ready rather than start a longer task.` };
    },
    // Something started a while ago and left in progress.
    c => {
      const stale = c.all.filter(t => t.status === 'doing' && t !== c.active && (c.now - (t.updatedAt || 0)) > 86400000)
        .sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0))[0];
      if (!stale) return null;
      const d = Math.max(1, Math.round((c.now - stale.updatedAt) / 86400000));
      return { key: 'stale:' + stale.id, w: 80, task: stale, label: 'Pick it back up',
        text: `You started ${esc(stale.title)} ${d === 1 ? 'yesterday' : d + ' days ago'} and it's still in progress. Finishing it beats opening something new.` };
    },
    // Repeatedly pushed back.
    c => {
      const pushed = c.candidates.filter(x => x.t.originalDate && x.t.originalDate < c.td && daysBetween(x.t.originalDate, c.td) >= 2)
        .sort((a, b) => a.t.originalDate < b.t.originalDate ? -1 : 1)[0];
      if (!pushed) return null;
      const fit = !c.busy && pushed.mins <= c.minutes;
      return { key: 'pushed:' + pushed.t.id, w: 70, task: fit ? pushed.t : null, cat: pushed.t.category,
        text: `${esc(pushed.t.title)} was first planned for ${esc(dayLabel(pushed.t.originalDate))} and keeps moving. ${fit ? `It fits in the time you have now (~${pushed.mins} min).` : 'Worth deciding whether it still matters, or giving it a fixed time.'}` };
    },
    // Momentum: a project step finished today, so suggest that project's next step.
    c => {
      const doneStep = c.all.filter(t => t.status === 'done' && t.projectId && t.completedAt && ymd(new Date(t.completedAt)) === c.td)
        .sort((a, b) => b.completedAt - a.completedAt)[0];
      if (!doneStep || !S.projects[doneStep.projectId]) return null;
      const nextStep = c.candidates.find(x => x.t.projectId === doneStep.projectId);
      if (!nextStep) return null;
      return { key: 'momentum:' + nextStep.t.id, w: 60, task: nextStep.t,
        text: `You finished ${esc(doneStep.title)} for ${esc(projName(doneStep.projectId))} today. Next step while it's fresh: ${esc(nextStep.t.title)} (~${nextStep.mins} min).` };
    },
    // A long clear stretch: good for focused work.
    c => {
      if (c.active || c.busy || c.minutes < 60) return null;
      const deep = c.candidates.find(x => x.fits && x.mins >= 40 && (x.t.projectId || ['work', 'self'].includes(x.t.category)));
      if (!deep) return null;
      const span = c.open ? 'a clear stretch with nothing else scheduled' : `about ${minLabel(c.minutes)} before ${esc(c.next.title)}`;
      return { key: 'deep:' + deep.t.id, w: 50, task: deep.t,
        text: `You have ${span}. That's long enough for ${esc(deep.t.title)}, which needs a real focus block (~${deep.mins} min).` };
    },
    // A project that hasn't moved in two weeks.
    c => {
      const stuck = Object.values(S.projects).filter(p => p.status !== 'archived').map(p => {
        const steps = c.all.filter(t => t.projectId === p.id);
        const last = Math.max(p.createdAt || 0, ...steps.map(t => t.completedAt || 0));
        const nextStep = c.candidates.filter(x => x.t.projectId === p.id).sort((a, b) => a.mins - b.mins)[0];
        return { p, last, nextStep };
      }).filter(x => x.nextStep && c.now - x.last > 14 * 86400000).sort((a, b) => a.last - b.last)[0];
      if (!stuck) return null;
      return { key: 'stuck:' + stuck.p.id, w: 30, task: stuck.nextStep.t,
        text: `${esc(stuck.p.name)} hasn't moved in over two weeks. Smallest next step: ${esc(stuck.nextStep.t.title)} (~${stuck.nextStep.mins} min).` };
    }
  ];

  function renderSmart() {
    const box = $('smartBox'); if (!box) return;
    const c = smartContext();
    const td = today();
    const out = [];
    SMART_RULES.forEach(rule => { try { const s = rule(c); if (s && smartDismissed[s.key] !== td) out.push(s); } catch (e) { console.warn('suggestion', e); } });
    const seen = new Set();
    const list = out.sort((a, b) => b.w - a.w).filter(s => { const k = s.task ? s.task.id : s.key; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, CAP[capMode()].suggestions);
    const items = list.map(s => `<div class="sg-item" ${s.task || s.cat ? `style="border-left-color:${catColor(s.task ? s.task.category : s.cat)}"` : ''}>
        <div class="sg-text">${s.text}</div>
        <div class="st-acts">
          ${s.task && s.task !== c.pick && !(c.active && c.active.id === s.task.id) ? `<button class="mini primary" data-act="sg-start" data-id="${esc(s.task.id)}">${esc(s.label || 'Start this')}</button>` : ''}
          <button class="mini" data-act="sg-dismiss" data-key="${esc(s.key)}">Dismiss</button>
        </div></div>`).join('');
    const gentle = capMode() === 'survival' ? '<div class="cap-note" style="margin:0 0 8px">Survival mode: essentials only. Rest counts as getting something done.</div>' : '';
    box.innerHTML = `<div class="card"><h2>✨ Smart Suggestions</h2>${gentle}${items || '<div class="empty">Nothing needs a nudge right now. Suggestions appear as your day and list change.</div>'}</div>`;
  }

  function tickClock() {
    const el = $('stClock'); if (!el) return;
    const t = Object.values(S.tasks).find(x => x.status === 'doing' && x.timer && x.timer.startedAt);
    if (!t || el.classList.contains('paused')) return;
    const ms = elapsedMs(t); el.textContent = fmtElapsed(ms);
    const bar = $('stBar'); const mins = taskMinutes(t);
    if (bar) { bar.style.width = Math.min(100, Math.round(ms / 60000 / mins * 100)) + '%'; bar.classList.toggle('over', ms / 60000 > mins); }
  }

  function wireSmart() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el) return;
      const id = el.dataset.id;
      switch (el.dataset.act) {
        case 'st-start': case 'st-resume': startTimer(id); break;
        case 'st-pause': pauseTimer(id); break;
        case 'st-complete': completeTimer(id); break;
        case 'st-aside': setAside(id); break;
        case 'st-skip': stSkip.push(id); renderTracker(); break;
        case 'sg-start': {
          startTimer(id);
          const tb = $('trackerBox'); if (tb && tb.scrollIntoView) tb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          break;
        }
        case 'sg-dismiss': {
          const td = today();
          Object.keys(smartDismissed).forEach(k => { if (smartDismissed[k] !== td) delete smartDismissed[k]; });
          smartDismissed[el.dataset.key] = td; lsSet(SMART_LS, smartDismissed); renderSmart(); break;
        }
      }
    });
    setInterval(tickClock, 1000);
    setInterval(() => { if (!document.hidden) { renderTracker(); renderSmart(); } }, 60000);
  }

  // ---------- Now: next-up card + full-day timeline. Reads the same data as the tracker; adds no new state ----------
  const DAY_START_MIN = 7 * 60;
  const MIN_GAP = 20;                                   // shorter gaps aren't worth suggesting into
  const relLabel = m => m <= 0 ? 'now' : `in ${minLabel(Math.round(m / 5) * 5 || m)}`;
  function dayItems(td, nowMin) {
    const items = [];
    eventsOn(td).forEach(ev => {
      if (ev.allDay) return;
      const st = evMin(ev);
      const en = ev.end ? (d => d.getHours() * 60 + d.getMinutes())(new Date(ev.end)) : st;
      items.push({ kind: 'cal', start: st, end: Math.max(st, en), title: ev.title || 'Calendar event', color: 'var(--cal)' });
    });
    Object.values(S.tasks).forEach(t => {
      if (t.date !== td || !t.time || !(isOpen(t) || t.status === 'done')) return;
      const m = timeMin(t.time); if (m >= 9000) return;
      items.push({ kind: 'task', start: m, end: m + taskMinutes(t), title: t.title, color: catColor(t.category), done: t.status === 'done', id: t.id });
    });
    (Array.isArray(meta().keyTimes) ? meta().keyTimes : []).forEach(k => {
      const hit = String(k).match(/(\d{1,2}(?::\d{2})?\s*[ap]\.?\s*m\.?)/i); if (!hit) return;
      const m = timeMin(hit[1].replace(/\s+/g, ' ')); if (m >= 9000) return;
      const label = String(k).replace(hit[1], '').replace(/[:\-–@]+\s*$/, '').replace(/\bat\s*$/i, '').trim();
      items.push({ kind: 'key', start: m, end: m, title: label || 'Key time' });
    });
    return items.sort((a, b) => a.start - b.start || a.end - b.end);
  }
  // Free windows from now to the end of the day, each with a best-fit task (no task used twice).
  function freeGaps(items, td, nowMin) {
    const gaps = []; let cursor = Math.max(nowMin, DAY_START_MIN);
    const busy = items.filter(i => !i.done && i.end > cursor);
    for (const it of busy) {
      const end = it.start - BUFFER_MIN;
      if (end - cursor >= MIN_GAP) gaps.push({ start: cursor, end });
      cursor = Math.max(cursor, it.end);
    }
    if (DAY_END_MIN - cursor >= MIN_GAP) gaps.push({ start: cursor, end: DAY_END_MIN });
    const used = new Set(stSkip);
    const all = Object.values(S.tasks);
    gaps.forEach(g => {
      const len = g.end - g.start;
      const fit = rankCandidates(all, td, g.start, len).find(x => x.fits && !used.has(x.t.id) && !(x.t.date === td && x.t.time));  // timed tasks already own a slot
      if (fit) { used.add(fit.t.id); g.fit = fit; }
    });
    return gaps;
  }
  function renderNow() {
    const box = $('nowBox'); if (!box) return;
    const c = smartContext();
    const td = c.td, nowMin = c.nowMin;
    const items = dayItems(td, nowMin);
    const upcoming = items.filter(i => !i.done && i.start > nowMin).slice(0, 3);
    const gaps = freeGaps(items, td, nowMin);
    const fitting = c.candidates.filter(x => x.fits && !stSkip.includes(x.t.id));

    let hero;
    if (c.active) {
      const t = c.active, run = !!t.timer.startedAt;
      hero = `<div class="now-hero" style="border-left-color:${catColor(t.category)}">
        <div class="lbl">${run ? 'Working on' : 'Paused'}</div>
        <div class="ttl">${esc(t.title)}</div>
        <div class="big" id="nowClock">${fmtElapsed(elapsedMs(t))}</div>
        <div class="sub">~${taskMinutes(t)} min planned${c.next ? ` · ${esc(c.next.title)} at ${esc(clockLabel(c.next.min))}` : ''}</div>
        <div class="acts">
          <button class="btn-add" data-act="now-done" data-id="${esc(t.id)}">Mark done</button>
          <button class="btn-secondary" data-act="${run ? 'now-pause' : 'now-resume'}" data-id="${esc(t.id)}">${run ? 'Pause' : 'Resume'}</button>
        </div></div>`;
    } else if (c.busy) {
      hero = `<div class="now-hero" style="border-left-color:var(--cal)"><div class="lbl">Now</div>
        <div class="ttl">${esc(c.busy.title)}</div><div class="sub">Until ${esc(clockLabel(c.busy.until))}. Your next pick shows up when it ends.</div></div>`;
    } else if (c.minutes < 10 && c.next) {
      hero = `<div class="now-hero"><div class="lbl">Coming up</div>
        <div class="ttl">${esc(c.next.title)}</div><div class="sub">At ${esc(clockLabel(c.next.min))}. Not enough time to start something new.</div></div>`;
    } else if (fitting.length) {
      const { t, mins } = fitting[0];
      const win = c.open ? `Free for about ${minLabel(c.minutes)}` : `Free until ${clockLabel(c.next.min)} · ${minLabel(c.minutes)}`;
      const from = t.date && t.date < td ? ` · from ${esc(dayLabel(t.date))}` : '';
      hero = `<div class="now-hero" style="border-left-color:${catColor(t.category)}">
        <div class="lbl">${esc(win)}</div>
        <div class="ttl">${esc(t.title)}</div>
        <div class="sub">~${mins} min${from}${t.projectId ? ` · ${esc(projName(t.projectId))}` : ''}${capMode() === 'survival' ? ' · or rest, that counts too' : ''}</div>
        <div class="acts">
          <button class="btn-add" data-act="now-start" data-id="${esc(t.id)}">Start</button>
          ${fitting.length > 1 ? `<button class="btn-secondary" data-act="now-skip" data-id="${esc(t.id)}">Something else</button>` : ''}
        </div></div>`;
    } else if (stSkip.length && c.candidates.some(x => x.fits)) {
      stSkip = []; return renderNow();
    } else if (c.candidates.length) {
      hero = `<div class="now-hero"><div class="lbl">${c.open ? `Free for about ${esc(minLabel(c.minutes))}` : `Free until ${esc(clockLabel(c.next.min))}`}</div>
        <div class="ttl">${capMode() === 'survival' ? 'Nothing essential right now' : 'Nothing on your list fits this window'}</div><div class="sub">${capMode() === 'survival' ? 'Rest counts. Sit down if you can.' : 'A quick reset or a break works here.'}</div></div>`;
    } else {
      hero = `<div class="now-hero"><div class="lbl">Now</div><div class="ttl">Your list is clear</div>
        <div class="sub">Add tasks in Brain dump below and they'll show up here.</div></div>`;
    }

    const row = (i, rel) => {
      const dot = i.kind === 'key' ? '<span class="now-dot key"></span>'
        : `<span class="now-dot ${i.kind === 'cal' ? 'cal' : ''}" style="background:${esc(i.color)}"></span>`;
      return `<div class="now-row ${i.past ? 'past' : ''} ${i.done ? 'done' : ''}"><span class="when">${esc(clockLabel(i.start))}</span>${dot}
        <span class="what">${esc(i.title)}</span>${rel ? `<span class="rel">${esc(rel)}</span>` : ''}</div>`;
    };
    const then = upcoming.length
      ? `<div class="now-then"><div class="h">Then</div>${upcoming.map((i, n) => row(i, n === 0 ? relLabel(i.start - nowMin) : '')).join('')}</div>` : '';

    const full = !!ui.open.nowFull;
    let day = '';
    if (full) {
      const allDay = eventsOn(td).filter(ev => ev.allDay);
      const seq = [];
      items.forEach(i => seq.push({ at: i.start, html: row(Object.assign({}, i, { past: i.end <= nowMin && i.start < nowMin })) }));
      gaps.forEach((g, n) => {
        const current = g.start <= nowMin + 1;
        seq.push({ at: g.start + 0.5, html: `<div class="now-gap ${current ? 'current' : ''}"><div class="gh"><span>Free ${esc(clockLabel(g.start))} to ${esc(clockLabel(g.end))}</span><span>${esc(minLabel(g.end - g.start))}</span></div>
          ${g.fit ? `<div class="fit"><span class="now-dot" style="background:${catColor(g.fit.t.category)}"></span><span style="flex:1">${esc(g.fit.t.title)}</span><span class="muted">~${g.fit.mins} min</span></div>` : ''}</div>` });
      });
      seq.push({ at: nowMin + 0.25, html: `<div class="now-line"><span>${esc(clockLabel(nowMin))}</span><i></i></div>` });
      seq.sort((a, b) => a.at - b.at);
      day = `<div class="now-day">${allDay.length ? `<div class="now-allday">${allDay.map(ev => `<span>${esc(ev.title || 'All day')}</span>`).join('')}</div>` : ''}
        ${seq.map(x => x.html).join('')}</div>`;
    }
    const hasDay = items.length || gaps.length;
    box.innerHTML = `<div class="card now-card">
      <div class="now-head"><h2>Now <span class="now-clock">${esc(clockLabel(nowMin))}</span></h2>${capToggle()}</div>
      ${hero}${full ? '' : then}
      ${hasDay ? `<button class="toggle-line now-toggle" data-act="now-full" aria-expanded="${full}">${full ? 'Show less' : 'Full day'}</button>` : ''}
      ${day}</div>`;
  }
  // ---------- capacity modes ----------
  const CAP = {
    full:     { label: 'Full',     maxTask: 999, suggestions: 3 },
    light:    { label: 'Light',    maxTask: 30,  suggestions: 2 },
    survival: { label: 'Survival', maxTask: 20,  suggestions: 1 }
  };
  const capMode = () => { const m = (meta().capacity || {}).mode; return CAP[m] ? m : 'full'; };
  // Survival keeps the essentials: kids, self-care, anything timed for today, and high priority. Projects pause.
  function isEssential(t) {
    if (t.date === today() && t.time) return true;
    if (priorityScore(t.priority) >= 30) return true;
    if (t.projectId) return false;
    return t.category === 'kids' || t.category === 'self';
  }
  const capVisible = t => !isOpen(t) || capMode() !== 'survival' || isEssential(t);
  const capToggle = () => `<div class="cap" role="group" aria-label="Capacity today">${Object.keys(CAP).map(k =>
    `<button data-act="cap-set" data-mode="${k}" aria-pressed="${capMode() === k}">${CAP[k].label}</button>`).join('')}</div>`;

  // ---------- inbox -> task ----------
  const mailTask = m => Object.values(S.tasks).find(t => t.mailId === m.id && t.status !== 'dropped');
  const mailTaskBtn = m => mailTask(m)
    ? `<button class="mini made" data-act="tab" data-tab="home" aria-label="Already a task">✓ Task</button>`
    : `<button class="mini" data-act="mail-task" data-id="${esc(m.id)}">Make task</button>`;
  function makeMailTask(id) {
    const m = (live.mail || []).find(x => x.id === id); if (!m || mailTask(m)) return;
    const t = makeTask({ title: m.subject, category: guessCategory(`${m.subject} ${m.from || ''}`), date: today(), source: 'gmail' });
    t.mailId = m.id; t.notes = `From ${m.from || 'email'} · https://mail.google.com/mail/u/0/#inbox/${m.threadId || m.id}`;
    put('tasks', t);
  }

  // ---------- weekly reset ----------
  const weekStart = () => { const d = parseYmd(today()); const back = (d.getDay() + 6) % 7; return addDays(today(), -back); };   // Monday
  function stuckTasks() {
    const td = today();
    const wk = weekStart();
    return Object.values(S.tasks).filter(t => isOpen(t) && t.reviewedOn !== wk && !(t.date && t.date > td)
        && (t.originalDate || t.date) && daysBetween(t.originalDate || t.date, td) >= 3)
      .map(t => ({ t, days: daysBetween(t.originalDate || t.date, td) })).sort((a, b) => b.days - a.days);
  }
  function renderResetBanner() {
    const el = $('resetBanner'); if (!el) return;
    const d = new Date().getDay(), key = weekStart();
    const show = (d === 0 || (d === 1 && new Date().getHours() < 12)) && meta().resetDone !== key && ui.resetHidden !== key;
    const stuck = stuckTasks().length;
    el.innerHTML = show ? `<div class="card reset-banner"><span>🧺 Weekly reset is ready${stuck ? ` · ${stuck} stuck task${stuck === 1 ? '' : 's'}` : ''}</span>
      <span style="display:flex;gap:6px"><button class="mini primary" data-act="reset-open">Open</button><button class="mini ghost" data-act="reset-hide" aria-label="Hide for this week">✕</button></span></div>` : '';
  }
  function renderReset() {
    const el = $('resetView'); if (!el) return;
    const td = today(), from = addDays(td, -6);
    const done = Object.values(S.tasks).filter(t => t.status === 'done' && t.completedAt && ymd(new Date(t.completedAt)) >= from);
    const byCat = {}; done.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + 1; });
    const maxN = Math.max(1, ...Object.values(byCat));
    const dropped = Object.values(S.tasks).filter(t => t.status === 'dropped' && t.droppedAt && ymd(new Date(t.droppedAt)) >= from).length;
    const stuck = stuckTasks();
    const list = stores();
    const items = Object.values(S.grocery).filter(g => !g.archived && !g.checked);
    const route = list.filter(st => items.some(g => g.store === st));
    const stuckHtml = stuck.length ? stuck.map(({ t, days }) => `<div class="rs-stuck">
        <div class="t">${esc(t.title)}</div>
        <div class="meta">Waiting ${days} days · ${esc((CATS[t.category] || {}).label || '')}${t.projectId ? ' · ' + esc(projName(t.projectId)) : ''}</div>
        <div class="acts">
          <button class="mini primary" data-act="rs-commit" data-id="${esc(t.id)}">Commit today</button>
          <input type="date" aria-label="Schedule ${esc(t.title)}" data-act="rs-date" data-id="${esc(t.id)}" min="${td}" value="">
          <button class="mini" data-act="drop" data-id="${esc(t.id)}">Drop</button>
        </div></div>`).join('') : '<div class="empty">Nothing has been waiting 3 days or more.</div>';
    const routeHtml = route.length ? route.map((st, i) => `<div class="rs-store">
        <div class="hd"><span class="n">${i + 1}. ${STORE_ICON[st] || '🏪'} ${esc(st)}</span>
          <button class="mini ghost" data-act="rs-up" data-store="${esc(st)}" aria-label="Move ${esc(st)} earlier" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="mini ghost" data-act="rs-down" data-store="${esc(st)}" aria-label="Move ${esc(st)} later" ${i === route.length - 1 ? 'disabled' : ''}>↓</button></div>
        <ul>${items.filter(g => g.store === st).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map(g => `<li>${esc(g.item)}</li>`).join('')}</ul></div>`).join('')
      : '<div class="empty">Your grocery lists are empty.</div>';
    el.innerHTML = `
      <div class="card"><h2>✅ This week</h2>
        <div class="rs-stat"><div><b>${done.length}</b><span>done</span></div><div><b>${stuck.length}</b><span>stuck 3+ days</span></div><div><b>${dropped}</b><span>let go</span></div></div>
        ${Object.keys(byCat).length ? Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<div class="rs-bar"><span class="lbl">${esc((CATS[c] || {}).label || c)}</span><span class="trk"><i style="width:${Math.round(n / maxN * 100)}%;background:${catColor(c)}"></i></span><span>${n}</span></div>`).join('') : '<div class="empty">Finished tasks from the last 7 days show up here.</div>'}
      </div>
      <div class="card"><h2>⏳ Stuck for 3+ days</h2><p class="cap-note" style="margin:0 0 8px">For each one: commit to today, pick a day, or drop it.</p>${stuckHtml}</div>
      <div class="card"><h2><span>🛒 Next week's groceries</span>${route.length ? '<button class="mini" data-act="rs-copy">Copy list</button>' : ''}</h2>
        <p class="cap-note" style="margin:0 0 8px">In route order. Use the arrows to match how you drive.</p>${routeHtml}</div>
      <button class="btn-add full" data-act="reset-done">Finish weekly reset</button>`;
  }
  function moveStore(st, dir) {

  }
  function groceryText() {
    const items = Object.values(S.grocery).filter(g => !g.archived && !g.checked);
    return stores().filter(st => items.some(g => g.store === st))
      .map(st => `${st}\n${items.filter(g => g.store === st).map(g => '- ' + g.item).join('\n')}`).join('\n\n');
  }
  function wireExtras() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el) return;

      switch (el.dataset.act) {
        case 'cap-set': setMeta({ capacity: { mode: el.dataset.mode, setOn: today() } }); break;

        case 'rs-up': moveStore(el.dataset.store, -1); break;
        case 'rs-down': moveStore(el.dataset.store, 1); break;
        case 'rs-copy': {
          const txt = groceryText();
          (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { el.textContent = 'Copied'; setTimeout(() => { el.textContent = 'Copy list'; }, 1500); })
            .catch(() => { window.prompt('Copy your list:', txt); });
          break;
        }
      }
    });
    document.addEventListener('change', e => {
      const el = e.target; if (!el.matches || !el.matches('[data-act="rs-date"]') || !el.value) return;
      moveTo(el.dataset.id, el.value); setTask(el.dataset.id, { reviewedOn: weekStart() });

  function wireFolds() {
    document.querySelectorAll('details.fold').forEach(el => { el.open = !!ui.open['fold-' + el.dataset.fold]; });
    document.addEventListener('toggle', e => {
      const el = e.target; if (!el.matches || !el.matches('details.fold')) return;

      const el = e.target.closest('[data-act="dress-toggle"]'); if (!el) return;
      if (editDress) return;                     // finish editing with Save first

  }
  function wireNow() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el) return;

      switch (el.dataset.act) {
        case 'now-start': case 'now-resume': startTimer(id); break;
        case 'now-pause': pauseTimer(id); break;
        case 'now-done': completeTimer(id); break;

      }
    });
    setInterval(() => { const el = $('nowClock'); if (!el) return; const t = Object.values(S.tasks).find(x => x.status === 'doing' && x.timer && x.timer.startedAt); if (t) el.textContent = fmtElapsed(elapsedMs(t)); }, 1000);
    setInterval(() => { if (!document.hidden && !drag) renderNow(); }, 60000);
  }

  // ---------- board: one ordered view of today's tasks, shared by Home and the Kanban ----------
  const COLS = ['todo', 'doing', 'done'];
  const COL_LABEL = { todo: 'To do', doing: 'In progress', done: 'Done' };
  const byBoardOrder = (a, b) => {
    const ao = a.order, bo = b.order;
    if (ao != null && bo != null) return ao - bo || byTime(a, b);
    if (ao != null) return -1;
    if (bo != null) return 1;
    return (a.date || '') < (b.date || '') ? -1 : (a.date || '') > (b.date || '') ? 1 : byTime(a, b);
  };
  function board() {
    const { carry, todayOpen, doneToday } = views();
    const open = [...carry, ...todayOpen];
    return {
      todo: open.filter(t => t.status === 'todo').sort(byBoardOrder),
      doing: open.filter(t => t.status === 'doing').sort(byBoardOrder),
      done: doneToday
    };
  }
  function dragHandle(t, boardName) {
    return `<button type="button" class="drag-handle" data-handle data-id="${esc(t.id)}" data-board="${boardName}"
      aria-label="Move “${esc(t.title)}”. Arrow keys: up and down to reorder, left and right to change column.">⋮⋮</button>`;
  }
  // Put task `id` into column `col` at position `index`; renumber that column so the order syncs everywhere.
  function dropTask(id, col, index) {
    const t = S.tasks[id]; if (!t) return;
    const statusPatch = {};
    if (t.status !== col) {
      statusPatch.status = col;
      if (t.timer) { statusPatch.spentMin = (t.spentMin || 0) + Math.round(elapsedMs(t) / 60000); statusPatch.timer = null; }
      statusPatch.completedAt = col === 'done' ? Date.now() : null;
    }
    if (col === 'done') {                      // Done is ordered by completion time, newest first
      if (statusPatch.status) { stage('tasks', Object.assign({}, t, statusPatch)); commit(); } else render();
      return;
    }
    const list = board()[col].filter(x => x.id !== id);
    index = Math.max(0, Math.min(index, list.length));
    list.splice(index, 0, Object.assign({}, t, statusPatch));
    let changed = false;
    list.forEach((x, i) => {
      const order = (i + 1) * 1000;
      if (x.order === order && x.id !== id) return;
      if (x.id === id && x.order === order && !statusPatch.status) return;
      stage('tasks', Object.assign({}, x, { order })); changed = true;
    });
    changed ? commit() : render();
  }

  let drag = null, renderDeferred = false;
  function startDrag(e, handle) {
    const item = handle.closest('[data-drag-id]'), zone = handle.closest('[data-drop]');
    if (!item || !zone) return;
    e.preventDefault();
    const r = item.getBoundingClientRect();
    const ghost = item.cloneNode(true);
    ghost.classList.add('drag-ghost');
    Object.assign(ghost.style, { width: r.width + 'px', left: r.left + 'px', top: r.top + 'px' });
    ghost.removeAttribute('data-drag-id');
    document.body.appendChild(ghost);
    const ph = document.createElement('div');
    ph.className = 'drag-placeholder'; ph.style.height = r.height + 'px';
    item.after(ph);
    item.classList.add('drag-src');
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { id: item.dataset.dragId, board: handle.dataset.board, item, ghost, ph, zone, pointerId: e.pointerId,
      dx: e.clientX - r.left, dy: e.clientY - r.top, x: e.clientX, y: e.clientY, raf: 0 };
    zone.classList.add('over');
    document.body.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(8);
    const tick = () => {                          // auto-scroll near the screen edges
      if (!drag) return;
      const edge = 72, h = window.innerHeight;
      const v = drag.y < edge ? -Math.ceil((edge - drag.y) / 6) : drag.y > h - edge ? Math.ceil((drag.y - (h - edge)) / 6) : 0;
      if (v) { window.scrollBy(0, v); placeDrag(); }
      drag.raf = requestAnimationFrame(tick);
    };
    drag.raf = requestAnimationFrame(tick);
  }
  function moveDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    e.preventDefault();
    drag.x = e.clientX; drag.y = e.clientY;
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    placeDrag();
  }
  function placeDrag() {
    const under = document.elementFromPoint(drag.x, drag.y);
    let zone = under && under.closest('[data-drop]');
    if (!zone) {                                  // between columns: snap to the closest one on this board
      let best = null, bestD = Infinity;
      document.querySelectorAll(`[data-drop][data-board="${drag.board}"]`).forEach(z => {
        const r = z.getBoundingClientRect();
        const dx = drag.x < r.left ? r.left - drag.x : drag.x > r.right ? drag.x - r.right : 0;
        const dy = drag.y < r.top ? r.top - drag.y : drag.y > r.bottom ? drag.y - r.bottom : 0;
        const d = dx * dx + dy * dy; if (d < bestD) { bestD = d; best = z; }
      });
      if (!best || bestD > 120 * 120) return;
      zone = best;
    }
    if (zone.dataset.board !== drag.board) return;
    if (zone !== drag.zone) { drag.zone.classList.remove('over'); zone.classList.add('over'); drag.zone = zone; }
    const before = [...zone.querySelectorAll(':scope > [data-drag-id]')]
      .filter(el => el !== drag.item)
      .find(el => { const r = el.getBoundingClientRect(); return drag.y < r.top + r.height / 2; });
    if (before) { if (drag.ph.nextElementSibling !== before) zone.insertBefore(drag.ph, before); }
    else if (zone.lastElementChild !== drag.ph) zone.appendChild(drag.ph);
  }
  function endDrag(cancel) {
    if (!drag) return;
    const d = drag; drag = null;
    cancelAnimationFrame(d.raf);
    const col = d.zone.dataset.drop;
    let index = 0;
    for (let n = d.ph.previousElementSibling; n; n = n.previousElementSibling) if (n.dataset && n.dataset.dragId && n !== d.item) index++;
    d.ghost.remove(); d.ph.remove(); d.item.classList.remove('drag-src'); d.zone.classList.remove('over');
    document.body.classList.remove('dragging');
    renderDeferred = false;
    if (cancel) render(); else dropTask(d.id, col, index);
  }
  function keyMove(e, h) {
    const id = h.dataset.id, t = S.tasks[id]; if (!t) return;
    const col = t.status === 'done' ? 'done' : t.status;
    const ci = COLS.indexOf(col), i = board()[col].findIndex(x => x.id === id);
    if (e.key === 'ArrowUp' && i > 0) dropTask(id, col, i - 1);
    else if (e.key === 'ArrowDown') dropTask(id, col, i + 1);
    else if (e.key === 'ArrowLeft' && ci > 0) dropTask(id, COLS[ci - 1], 0);
    else if (e.key === 'ArrowRight' && ci < COLS.length - 1) dropTask(id, COLS[ci + 1], 0);
    else return;
    e.preventDefault();
    const again = document.querySelector(`[data-handle][data-board="${h.dataset.board}"][data-id="${CSS.escape(id)}"]`);
    if (again) again.focus();
  }
  function wireDrag() {
    document.addEventListener('pointerdown', e => {
      const h = e.target.closest && e.target.closest('[data-handle]');
      if (!h || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
      startDrag(e, h);
    });
    document.addEventListener('pointermove', moveDrag, { passive: false });
    document.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pointerId) endDrag(false); });
    document.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pointerId) endDrag(true); });
    document.addEventListener('keydown', e => {
      if (drag && e.key === 'Escape') { endDrag(true); return; }
      const h = e.target.closest && e.target.closest('[data-handle]');
      if (h && /^Arrow/.test(e.key)) keyMove(e, h);
    });
  }

  function wireEvents() {
    wireDrag();
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el) return;
      const act = el.dataset.act, id = el.dataset.id;
      switch (act) {
        case 'tab': ui.tab = el.dataset.tab; saveUi(); render(); window.scrollTo({ top: 0 }); break;
        case 'sub': ui.sub = el.dataset.sub; saveUi(); render(); break;
        case 'toggle': { const t = S.tasks[id]; if (t) setTask(id, { status: t.status === 'done' ? 'todo' : 'done' }); break; }
        case 'status': setTask(id, { status: el.dataset.to }); break;
        case 'to-today': moveTo(id, today()); break;
        case 'to-tomorrow': moveTo(id, addDays(today(), 1)); break;
        case 'drop': setTask(id, { status: 'dropped', droppedAt: Date.now() }); break;
        case 'carry-all-today': { const td = today(); views().carry.forEach(t => stage('tasks', Object.assign({}, t, { date: td, originalDate: t.originalDate || t.date }))); commit(); break; }
        case 'carry-drop-all': {
          if (confirmKey !== 'carry-drop') { armConfirm('carry-drop'); return; }
          confirmKey = null; views().carry.forEach(t => stage('tasks', Object.assign({}, t, { status: 'dropped', droppedAt: Date.now() }))); commit(); break;
        }
        case 'toggle-done': ui.showDone = !ui.showDone; saveUi(); render(); break;
        case 'organize': {
          const ta = $('dumpText'); const text = ta.value.trim(); if (!text) { ta.focus(); return; }
          const dump = { id: newId('d'), text, createdAt: Date.now(), processed: false };
          put('dumps', dump); ta.value = ''; lsSet(LS.draft, '');
          sortDump(dump); break;
        }
        case 'dump-retry': { const d = S.dumps[id]; if (d) sortDump(d); break; }
        case 'dump-dismiss': {
          if (confirmKey !== 'dd-' + id) { armConfirm('dd-' + id); return; }
          confirmKey = null; const d = S.dumps[id]; if (d) put('dumps', Object.assign({}, d, { processed: true, dismissed: true, processedAt: Date.now() })); break;
        }
        case 'rv-inc': { const arr = review && review[el.dataset.kind]; if (arr) { arr[+el.dataset.i].include = el.checked; render(); } break; }
        case 'rv-commit': commitReview(); break;
        case 'rv-cancel': review = null; render(); break;
        case 'kt-del': { const kt = (meta().keyTimes || []).slice(); kt.splice(+el.dataset.i, 1); setMeta({ keyTimes: kt }); break; }
        case 'dress-edit': {
          if (editDress) {
            const big = ($('dcBig') || {}).value || ''; const baby = ($('dcBaby') || {}).value || '';
            editDress = false; setMeta({ dress: { big: big.trim(), baby: baby.trim(), date: today() } });
          } else { editDress = true; render(); }
          break;
        }
        case 'add-task': addTaskFromForm(); break;
        case 'add-project': addProject(); break;
        case 'acc': ui.open[el.dataset.key] = !(el.classList.contains('active')); saveUi(); render(); break;
        case 'note-del': { if (confirmKey !== 'nd-' + id) { armConfirm('nd-' + id); return; } confirmKey = null; unstage('notes', id); commit(); break; }
        case 'note-task': { const n = S.notes[id]; if (!n) return; stage('tasks', makeTask({ title: n.text, category: guessCategory(n.text), source: 'idea' })); unstage('notes', id); commit(); break; }
        case 'groc-toggle': { const g = S.grocery[id]; if (g) put('grocery', Object.assign({}, g, { checked: !g.checked, checkedAt: !g.checked ? Date.now() : null })); break; }
        case 'groc-del': { const g = S.grocery[id]; if (g) put('grocery', Object.assign({}, g, { archived: true, archivedAt: Date.now() })); break; }
        case 'groc-clear': {
          const si = el.dataset.si; if (confirmKey !== 'gc-' + si) { armConfirm('gc-' + si); return; }
          confirmKey = null; const s = stores()[+si];
          Object.values(S.grocery).filter(g => !g.archived && g.checked && g.store === s).forEach(g => stage('grocery', Object.assign({}, g, { archived: true, archivedAt: Date.now() })));
          commit(); break;
        }
        case 'groc-quick': quickGrocery(); break;
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      const el = e.target; const act = el.dataset && el.dataset.enter; if (!act) return;
      e.preventDefault();
      const v = el.value.trim();
      switch (act) {
        case 'add-task': addTaskFromForm(); break;
        case 'add-project': addProject(); break;
        case 'kt-add': if (v) { setMeta({ keyTimes: [...(meta().keyTimes || []), v] }); el.value = ''; } break;
        case 'add-idea': if (v) { el.value = ''; put('notes', { id: newId('n'), text: v, projectId: null, createdAt: Date.now() }); } break;
        case 'proj-add': if (v) { const p = S.projects[el.dataset.id]; el.value = ''; put('tasks', makeTask({ title: v, category: (p && p.category) || 'self', projectId: el.dataset.id })); } break;
        case 'groc-add': if (v) { el.value = ''; addGrocery(v, stores()[+el.dataset.si]); } break;
        case 'groc-quick': quickGrocery(); break;
        case 'add-store': if (v && !stores().includes(v)) { el.value = ''; ui.open['g-' + v] = true; saveUi(); setMeta({ stores: [...stores(), v] }); } break;
      }
    });
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.id === 'dumpText') { lsSet(LS.draft, el.value); return; }
      if (el.dataset && el.dataset.rv && review && review[el.dataset.kind] && el.tagName === 'INPUT') {
        review[el.dataset.kind][+el.dataset.i][el.dataset.rv] = el.value;
      }
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'gStore') { ui.store = el.value; saveUi(); return; }
      if (el.dataset && el.dataset.rv && review && review[el.dataset.kind] && el.tagName === 'SELECT') {
        const it = review[el.dataset.kind][+el.dataset.i]; const f = el.dataset.rv;
        if (f === 'projectId') { if (el.value !== '__new') { it.projectId = el.value || null; it.newProject = null; } }
        else it[f] = el.value || null;
        render();
      }
    });
  }
  function addTaskFromForm() {
    const title = $('ntTitle').value.trim(); if (!title) { $('ntTitle').focus(); return; }
    const dv = $('ntDate').value;
    const date = dv === 'today' ? today() : dv === 'tomorrow' ? addDays(today(), 1) : null;
    $('ntTitle').value = ''; const time = fmt24($('ntTime').value); $('ntTime').value = '';
    put('tasks', makeTask({ title, category: $('ntCat').value, date, time }));
  }
  function addProject() {
    const name = $('npName').value.trim(); if (!name) return;
    if (Object.values(S.projects).some(p => norm(p.name) === norm(name))) { $('npName').value = ''; return; }
    const p = { id: newId('p'), name, category: 'self', status: 'active', notes: '', createdAt: Date.now() };
    $('npName').value = ''; ui.open['p-' + p.id] = true; saveUi(); put('projects', p);
  }
  function quickGrocery() {
    const el = $('gQuick'); const v = el.value.trim(); if (!v) return;
    el.value = ''; addGrocery(v, $('gStore').value);
  }

  init();
})();
</script>
